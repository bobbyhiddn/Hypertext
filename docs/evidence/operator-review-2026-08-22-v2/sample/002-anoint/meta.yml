ot_verse:
  ref: 1 Samuel 16:13
  snippet: Then Samuel took the horn of oil and anointed him in the midst of his brothers.
    And the Spirit of the LORD rushed upon David from that day forward.
nt_verse:
  ref: Acts 10:38
  snippet: how God anointed Jesus of Nazareth with the Holy Spirit and with power.
    He went about doing good and healing all who were oppressed by the devil, for
    God was with him.
greek:
  text: χρίω
  translit: chrió
hebrew:
  text: מָשַׁח
  translit: mashach
ot_refs: Exod 30:30 • Lev 8:12 • 1 Kgs 1:39 • Ps 23:5 • Ps 45:7 • Isa 61:1
nt_refs: Luke 4:18 • 2 Cor 1:21 • Heb 1:9 • Jas 5:14 • 1 John 2:20 • 1 John 2:27
trivia:
- The Hebrew word 'Mashiach' (Messiah) and the Greek 'Christos' (Christ) both mean
  'Anointed One'.
- The sacred anointing oil described in Exodus 30 was a specific blend of myrrh, cinnamon,
  calamus, cassia, and olive oil.
- Anointing was used to consecrate not only people like priests and kings, but also
  objects such as the Tabernacle and its furnishings.
