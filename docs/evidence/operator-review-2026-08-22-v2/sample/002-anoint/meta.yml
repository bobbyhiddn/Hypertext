number: '002'
word: ANOINT
gloss: To ceremonially apply oil to someone or something as a sign of consecration
  or divine selection.
card_type: VERB
rarity: UNCOMMON
series: 2026-Q1
set: Demo
art_prompt: A single drop of golden, viscous oil falls from the mouth of an ornate
  ceramic horn, about to land on the head of a humble figure kneeling below. Beams
  of light pierce through a dusty room, illuminating the moment. The scene is solemn
  and significant, rendered in a chiaroscuro style.
stats:
  lore: 4
  context: 4
  complexity: 3
ability: Choose a NAME in your Pages. It is also considered a TITLE until your next
