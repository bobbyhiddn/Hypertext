# Canonical Hypertext Lot recipes (Babel Alpha typed grammar, lot-rules-v2)
# Universal across sets. recipe.kind is one of: fixed | groups | all_types_plus_pair.
#  fixed: composition lists exact card types.
#  groups: ordered groups of {count, constraint, caption}; constraints: same_type (all one type),
#    one_type/another_type (two distinct types), any (unconstrained). TITLE-wild rules apply per docs/rules.md.
#  all_types_plus_pair: one of each of the five types plus a pair of any single type.
# Values (points/Letters) are derived from Lot size in hypertext.lots.rules; faces are series assets.

phases:
  - id: 1
    name: REMNANT
    cards: 5
    recipe:
      kind: groups
      groups:
        - {count: 4, constraint: same_type, caption: "SAME TYPE ×4"}
        - {count: 1, constraint: any, caption: "ANY"}
    display: "4 of one type + 1 any"

  - id: 2
