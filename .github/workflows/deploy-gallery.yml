name: Deploy Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/site/**'
      - '.github/workflows/deploy-gallery.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e package/

      - name: Build Gallery
        run: |
          python -m hypertext.pipeline.daily --phase gallery --series series --out-dir _site/gallery

      # The write-up is the front door; the gallery lives under /gallery/. The
      # landing page carries its images inline, so it can be copied verbatim -
      # a file served straight from the repo would be an LFS pointer, not a PNG.
      - name: Add landing page
        run: |
          cp docs/site/index.html _site/index.html
          cp docs/site/og.jpg _site/og.jpg
          test -s _site/index.html && test -s _site/gallery/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
