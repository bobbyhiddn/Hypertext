[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hypertext-tools"
version = "0.1.0"
description = "Biblical word-study trading card game toolkit"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0.0",
    "Pillow>=10.0.0",
    "PyYAML>=6.0",
    "google-genai>=1.40.0",
    "jsonschema>=4.0.0",
    "markdown>=3.0.0",
]

[project.optional-dependencies]
# The suite is the repo's contract check (template digests, gates, lot rules), so the
# tools needed to run it belong with the package: `pip install -e package[test]`.
test = [
    "pytest>=8.0.0",
    "pytest-subtests>=0.11.0",
]

[project.scripts]
hypertext = "hypertext.cli:cli"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
hypertext = ["templates/*", "templates/**/*"]
