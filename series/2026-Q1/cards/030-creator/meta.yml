number: '030'
word: CREATOR
gloss: One who brings into existence; the originator and sustainer of the universe.
card_type: TITLE
rarity: GLORIOUS
series: 2026-Q1
set: Babel
art_prompt: A pair of translucent, glowing hands shaping a swirling nebula into a
  perfect geometric sphere against a deep void; ethereal, cosmic, majestic style
stats:
  lore: 5
  context: 5
  complexity: 5
ability: Shuffle your hand and Sheol into the Tower, then draw 7 cards.
ot_verse:
  ref: Isaiah 40:28
  snippet: The everlasting God, the Lord, the Creator of the ends of the earth, fainteth
    not, neither is weary.
nt_verse:
  ref: Romans 1:25
  snippet: Who changed the truth of God into a lie, and worshipped and served the
    creature more than the Creator.
greek:
  text: Κτίστης
  translit: Ktistēs
hebrew:
  text: בּוֹרֵא
  translit: Bore
ot_refs: Gen 1:1 • Isa 40:28 • Eccl 12:1 • Isa 43:15
nt_refs: Rom 1:25 • Col 1:16 • 1 Pet 4:19 • Rev 4:11
trivia:
- The Hebrew verb 'bara' is used exclusively for God's activity; humans never 'bara'.
- The specific Greek noun 'Ktistes' appears only once in the New Testament (1 Peter
  4:19).
- The doctrine of 'creatio ex nihilo' (creation out of nothing) is central to biblical
  theology.
