trivia:
- The Hebrew verb 'bara' is used exclusively of God's creative activity, never of
  humans.
- The Greek noun 'Ktistes' appears only once in the New Testament (1 Peter 4:19).
- Biblical creation is 'ex nihilo' (out of nothing), distinguishing it from shaping
  pre-existing matter.
