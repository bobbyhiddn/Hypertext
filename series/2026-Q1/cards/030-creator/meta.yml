number: '030'
word: CREATOR
gloss: One who brings existence from nothing; the originator of all things.
card_type: TITLE
rarity: GLORIOUS
series: 2026-Q1
set: Babel
art_prompt: A pair of glowing, translucent hands cupping a swirling galaxy of light
  and dust amidst a void. The hands are shaping the chaos into a sphere. High contrast,
  ethereal style.
stats:
  lore: 5
  context: 5
  complexity: 4
ability: Shuffle Sheol into the Tower, then draw cards until you have 7 in your hand.
ot_verse:
  ref: Isaiah 40:28
  snippet: The everlasting God, the LORD, the Creator of the ends of the earth, fainteth
    not, neither is weary.
nt_verse:
  ref: 1 Peter 4:19
  snippet: Let them that suffer according to the will of God commit the keeping of
    their souls to him in well doing, as unto a faithful Creator.
greek:
  text: κτίστης
  translit: ktistēs
hebrew:
  text: בּוֹרֵא
  translit: bore
ot_refs: Gen 1:1 • Eccl 12:1 • Isa 43:15
nt_refs: Rom 1:25 • Col 1:16 • Rev 4:11
trivia:
- The Hebrew verb 'bara' is used exclusively of God's activity, never of humans.
- Implies 'creatio ex nihilo'—creation out of nothing, without pre-existing material.
- New Testament theology identifies Jesus as the agent through whom all things were
  made.
