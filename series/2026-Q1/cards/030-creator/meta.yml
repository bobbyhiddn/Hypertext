number: '030'
word: CREATOR
gloss: One who brings something into existence; the originator and sustainer of the
  universe.
card_type: TITLE
rarity: GLORIOUS
series: 2026-Q1
set: Babel
art_prompt: Two glowing, ethereal hands shaping a swirling galaxy from a void, starlight
  forming geometric constellations, cosmic and majestic style, deep blues and purples,
  no text.
stats:
  lore: 5
  context: 5
  complexity: 5
ability: Look at the top 7 cards of the Tower. Add 2 to your hand, then return the
  rest in any order.
ot_verse:
  ref: Isaiah 40:28
  snippet: The Creator of the ends of the earth, fainteth not, neither is weary.
nt_verse:
  ref: Revelation 4:11
  snippet: For thou hast created all things, and for thy pleasure they are and were
    created.
greek:
  text: Κτίστης
  translit: Ktistēs
hebrew:
  text: בּוֹרֵא
  translit: Bore
ot_refs: Gen 1:1 • Eccl 12:1 • Isa 43:15 • Amos 4:13
nt_refs: Rom 1:25 • Col 1:16 • 1 Pet 4:19 • Eph 3:9
trivia:
- The Hebrew verb 'bara' is used exclusively for God's acts, never for human creation.
- Creation 'ex nihilo' affirms God formed the universe from nothing, not pre-existing
  matter.
- Colossians 1:16 identifies Jesus as the agent through whom 'all things were created.'
