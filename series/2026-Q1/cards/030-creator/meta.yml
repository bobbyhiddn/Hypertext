number: '030'
word: CREATOR
gloss: One who brings something into existence; specifically, God as the maker of
  the universe.
card_type: TITLE
rarity: GLORIOUS
series: 2026-Q1
set: Babel
art_prompt: A pair of glowing, translucent hands shaping a swirling nebula of stars
  and geometric solids from a void of darkness; cosmic scale, ethereal light, vibrant
  colors of creation, gold and indigo palette.
stats:
  lore: 5
  context: 5
  complexity: 5
ability: Shuffle Sheol into the Tower. Then, draw 3 cards.
ot_verse:
  ref: Isaiah 40:28
  snippet: The Lord is the everlasting God, the Creator of the ends of the earth.
nt_verse:
  ref: 1 Peter 4:19
  snippet: Entrust their souls to a faithful Creator in doing what is right.
greek:
  text: κτίστης
  translit: ktistēs
hebrew:
  text: בּוֹרֵא
  translit: bore
ot_refs: Gen 1:1 • Isa 40:28 • Eccl 12:1
nt_refs: Rom 1:25 • Col 1:16 • 1 Pet 4:19
trivia:
- The Hebrew verb 'bara' is reserved solely for God's activity, implying only He can
  create from nothing.
- The Greek term 'ktistes' appears only once in the New Testament, portraying God
  as a faithful architect.
- Christ is identified as the agent of creation in the New Testament, through whom
  all things exist.
