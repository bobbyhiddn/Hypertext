ot_refs: Gen 1:1 • Isa 40:28 • Eccl 12:1
nt_refs: Col 1:16 • Rev 4:11 • 1 Pet 4:19
trivia:
- The Hebrew verb 'bara' is used exclusively for God's creative acts, never for human
  crafting.
- Creation 'ex nihilo' (out of nothing) distinguishes biblical cosmology from ancient
  myths.
- The New Testament identifies Jesus as the agent of creation, through whom all things
  were made.
