trivia:
- The Hebrew verb 'bara' is used exclusively of God's creative activity, never of
  humans.
- The concept of 'creatio ex nihilo' affirms that God created the universe out of
  nothing.
- The Greek noun 'Ktistēs' appears only once in the New Testament (1 Peter 4:19).
