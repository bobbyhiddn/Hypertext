trivia:
- The Hebrew verb 'bara' is used exclusively for God's act of creation, never for
  human making.
- Creatio ex nihilo is the theological doctrine that God created the universe out
  of nothing.
- The New Testament identifies Jesus as the agent of creation, through whom all things
  were made.
