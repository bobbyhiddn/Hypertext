number: '030'
word: CREATOR
gloss: One who brings something into existence out of nothing; specifically, God as
  the originator of the universe.
card_type: TITLE
rarity: GLORIOUS
series: 2026-Q1
set: Babel
art_prompt: A pair of translucent, glowing hands shaping a swirling galaxy from cosmic
  dust and starlight; vibrant nebulas condensing into solid spheres against a deep
  void; light piercing darkness.
stats:
  lore: 5
  context: 5
  complexity: 2
ability: Shuffle your hand and Sheol into the Tower, then draw 7 cards.
ot_verse:
  ref: Ecclesiastes 12:1
  snippet: Remember also your Creator in the days of your youth, before the evil days
    come.
nt_verse:
  ref: Romans 1:25
  snippet: They exchanged the truth of God for a lie and worshiped and served the
    creature rather than the Creator.
greek:
  text: Κτίστης
  translit: Ktistēs
hebrew:
  text: בּוֹרֵא
  translit: Bore
ot_refs: Gen 1:1 • Isa 40:28 • Eccl 12:1 • Isa 43:15
nt_refs: Rom 1:25 • 1 Pet 4:19 • Col 1:16 • Rev 4:11
trivia:
- The Hebrew verb 'bara' is used exclusively of God's creative activity, never of
  humans.
- Paul contrasts 'Ktistes' (Creator) with 'ktisis' (creation) to define the essence
  of idolatry.
- The plural noun 'Elohim' appears in Genesis 1:1, emphasizing the majesty and complexity
  of the Creator.
