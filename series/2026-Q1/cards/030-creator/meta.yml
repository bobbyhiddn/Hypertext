trivia:
- The Hebrew verb 'bara' (create) is used in the Bible exclusively for God's activity,
  never for humans.
- The doctrine of 'creatio ex nihilo' affirms that God created the universe out of
  nothing, not pre-existing matter.
- In the New Testament, Jesus is identified as the agent of creation through whom
  all things were made.
