number: '031'
word: SEE
gloss: To perceive with the eyes; to understand, witness, or have insight.
card_type: VERB
rarity: COMMON
series: 2026-Q1
set: Babel
art_prompt: A giant, stylized eye formed by the negative space of parting storm clouds,
  with golden rays of sunlight beaming down onto a green valley.
stats:
  lore: 4
  context: 3
  complexity: 1
ability: Look at the top 3 cards of the Tower. Add 1 to your hand and return the rest
  to the top in any order.
ot_verse:
  ref: Psalm 34:8
  snippet: Oh, taste and see that the LORD is good! Blessed is the man who takes refuge
    in him!
nt_verse:
  ref: John 9:25
  snippet: One thing I do know, that though I was blind, now I see.
greek:
  text: βλέπω
  translit: blepō
hebrew:
  text: רָאָה
  translit: ra'ah
ot_refs: Gen 1:4 • Gen 16:13 • Ex 3:3 • Isa 6:1
nt_refs: Matt 5:8 • John 1:39 • Heb 12:14 • Rev 1:7
trivia:
- The Hebrew verb ra'ah (to see) is the root of Jehovah Jireh, literally meaning 'The
  LORD will see to it.'
- Jesus healing the blind is the most frequently recorded category of miracle in the
  Gospels.
- Hagar named God El Roi ('The God Who Sees') after He sustained her in the wilderness.
