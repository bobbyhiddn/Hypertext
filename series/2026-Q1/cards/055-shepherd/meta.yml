stats_rationale:
  lore: the LORD is my shepherd and I am the good shepherd - the shepherd is a governing
    image of God's care and of Christ, a major theme close to doctrine
  context: roeh as the noun shepherd occurs 62 times in the Hebrew Bible; poimen occurs
    18 times in the New Testament; total 80
  complexity: roeh is the participle of raah, to pasture or feed, so shepherd and
    feeder are one word; poimen is straightforward and gives us pastor by way of Latin
ability: Look at the top three cards of the Tower. Add one of those cards to your
  hand and put the other cards on top of the Tower in any order.
