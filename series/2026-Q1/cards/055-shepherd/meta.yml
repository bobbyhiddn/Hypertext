trivia:
- Roeh means the one who pastures - the shepherd is literally the feeder of the flock.
- Ezekiel 34 promises one shepherd over the scattered; John 10 answers with one fold
  and one shepherd.
- Pastor is simply the Latin for shepherd; the office kept the old name.
