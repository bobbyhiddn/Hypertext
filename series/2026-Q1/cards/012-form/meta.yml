trivia:
- Genesis 2:19 forms the beasts from the ground with the same verb it used for the
  man; only the man receives the breath of life.
- Yatsar is written with a doubled letter in Genesis 2:7 that the rabbis read as two
  formations - one for this world and one for the next.
- Isaiah turns the verb into the potter and clay argument that Paul takes up in Romans
  9.
