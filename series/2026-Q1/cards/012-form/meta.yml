trivia:
- The Hebrew 'yatsar' implies the squeezing of clay into shape, depicting God as a potter.
- Paul uses 'morphoō' to describe spiritual maturity as the internal shaping of Christ within
  a believer.
- In Genesis, 'formed' (yatsar) is distinct from 'created' (bara), emphasizing the use of
  existing material (dust).
