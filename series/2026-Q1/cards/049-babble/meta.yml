trivia:
- Babel in Akkadian meant gate of god; Genesis hears balal, to confound - the city named by
  the pun that judged it.
- Battalogeo, Jesus' word for heathen prayer-babble in Matthew 6, is a New Testament hapax
  - possibly from Battus the stammerer.
- English babble is not from Babel at all - it is baby-talk onomatopoeia - yet the pun was
  waiting three thousand years for it.
