trivia:
- Genesis 11:9 names Babel from balal, to confound - a Hebrew pun on Babylon's own
  name.
- The Greek Old Testament renders balal with syncheo, the very word Acts 2 uses when
  the crowd was confounded.
- English babble is not from Babel - it imitates a baby's first sounds - but the two
  have kept company since Chaucer.
