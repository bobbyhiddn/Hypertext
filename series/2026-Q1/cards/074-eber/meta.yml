trivia:
- Shem is introduced in Genesis 10:21 not as Noah's son but as the father of all the
  children of Eber - the line is named four generations early.
- Abram is first called the Hebrew in Genesis 14:13; the word is Eber's name with
  a gentilic ending.
- Eber lived four hundred sixty-four years and, by the numbers of Genesis 11, outlived
  Abraham.
