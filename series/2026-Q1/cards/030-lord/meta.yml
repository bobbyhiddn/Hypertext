trivia:
- In English Bibles, 'LORD' (small caps) represents the Tetragrammaton (YHWH), God's
  personal name.
- The Greek 'Kyrios' is used for both Yahweh and Jesus in the NT, affirming Christ's
  divinity.
- The word implies absolute ownership, sovereignty, and the right to command obedience.
