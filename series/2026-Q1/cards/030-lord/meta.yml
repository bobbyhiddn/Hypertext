ot_verse:
  ref: Deuteronomy 6:4
  snippet: 'Hear, O Israel: The LORD our God, the LORD is one.'
nt_verse:
  ref: Revelation 19:16
  snippet: 'On his robe and on his thigh he has this name written: KING OF KINGS AND
    LORD OF LORDS.'
greek:
  text: Κύριος
  translit: Kyrios
hebrew:
  text: יהוה
  translit: YHWH
ot_refs: Ex 3:14 • Deut 6:4 • Ps 23:1 • Ps 110:1 • Isa 42:8
nt_refs: Matt 22:44 • Acts 2:36 • Rom 10:9 • Phil 2:11 • Rev 19:16
trivia:
- '"LORD" (all caps) represents the divine name YHWH, while "Lord" translates Adonai
  (Master).'
- The Greek Kyrios was used for YHWH in the Septuagint and applied to Jesus in the
  New Testament.
- Appears over 6,000 times in the Old Testament, revealing God as the personal, covenant-keeping
  Sovereign.
