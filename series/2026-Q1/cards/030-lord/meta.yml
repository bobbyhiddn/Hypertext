trivia:
- In English Bibles, 'LORD' (all caps) denotes the Hebrew name YHWH, while 'Lord'
  translates 'Adonai'.
- The Greek 'Kyrios' is used in the Septuagint for YHWH and in the NT for Jesus, asserting
  His divinity.
- YHWH appears over 6,800 times in the OT, derived from the verb 'to be', implying
  eternal self-existence.
