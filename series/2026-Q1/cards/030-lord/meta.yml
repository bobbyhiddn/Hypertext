number: '030'
word: LORD
gloss: One possessing absolute authority, ownership, and power; a master or ruler.
  The personal covenant name of God.
card_type: TITLE
rarity: GLORIOUS
series: 2026-Q1
set: Babel
art_prompt: A blinding, radiant crown of white fire hovering suspended above a humble,
  cracked clay vessel in a dark void; extreme contrast, majesty meeting humility
stats:
  lore: 5
  context: 5
  complexity: 5
ability: Swap your hand with target player.
ot_verse:
  ref: 1 Samuel 2:7
  snippet: The LORD makes poor and makes rich; he brings low and he exalts.
nt_verse:
  ref: Philippians 2:11
  snippet: And that every tongue should confess that Jesus Christ is Lord, to the
    glory of God the Father.
greek:
  text: Κύριος
  translit: Kyrios
hebrew:
  text: יהוה
  translit: Yahweh
ot_refs: Ex 3:14 • Deut 6:4 • Ps 23:1 • Isa 42:8
nt_refs: Rom 10:9 • Acts 2:36 • 1 Cor 8:6 • Rev 19:16
trivia:
- The Tetragrammaton (YHWH) appears over 6,800 times in the OT, usually translated
  as LORD.
- Jewish tradition substitutes 'Adonai' (Master) when reading YHWH to avoid pronouncing
  the divine name.
- The Greek 'Kyrios' is used in the NT for both YHWH and Jesus, affirming Christ's
  deity.
