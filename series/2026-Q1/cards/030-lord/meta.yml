trivia:
- In most English Bibles, 'LORD' (small caps) represents the Hebrew name YHWH.
- The Greek 'Kyrios' was used by the Septuagint for YHWH and applied to Jesus in the
  NT.
- The personal name of God appears over 6,800 times in the Old Testament.
