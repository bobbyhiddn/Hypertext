trivia:
- In English Bibles, 'LORD' (small caps) represents the Tetragrammaton, YHWH.
- The Greek 'Kyrios' was a title for Caesar, making its application to Jesus politically
  subversive.
- Jewish readers traditionally substitute 'Adonai' (Master) to avoid pronouncing the
  Divine Name.
