trivia:
- In English Bibles, 'LORD' (all caps) represents the Hebrew Tetragrammaton, YHWH.
- The Greek 'Kyrios' translates both the divine name and 'Adonai' (Master) in the
  Septuagint.
- This title appears over 6,000 times in the Old Testament, denoting absolute authority.
