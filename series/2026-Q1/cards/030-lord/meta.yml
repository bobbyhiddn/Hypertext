trivia:
- In English Bibles, 'LORD' (all caps) represents the Hebrew name YHWH, while 'Lord'
  represents Adonai.
- The Greek title 'Kurios' was politically charged, as Caesar claimed to be the supreme
  'Lord' of the empire.
- The phrase 'Lord of hosts' (Yahweh Sabaoth) depicts God as the commander of heaven's
  angelic armies.
