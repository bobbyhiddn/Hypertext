trivia:
- In English Bibles, 'LORD' (all caps) represents the divine name YHWH, which appears
  over 6,800 times.
- The Septuagint translated YHWH as 'Kyrios', a title the New Testament writers applied
  directly to Jesus.
- Jewish tradition substitutes 'Adonai' (my Lord) when reading to avoid pronouncing
  the sacred name.
