trivia:
- Translates the Tetragrammaton (YHWH), the holy covenant name of God revealed to
  Moses.
- The Greek 'Kyrios' is used for YHWH in the Septuagint and for Jesus in the New Testament.
- Occurs over 6,800 times in the Old Testament, more than any other name or title.
