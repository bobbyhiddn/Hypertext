trivia:
- The Tetragrammaton (YHWH) appears over 6,800 times in the Hebrew Bible.
- English Bibles use 'LORD' (small caps) for YHWH and 'Lord' for Adonai.
- The Greek 'Kyrios' was used for YHWH in the Septuagint and later applied to Jesus.
