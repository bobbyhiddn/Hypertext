trivia:
- Written as 'LORD' in all caps to represent the Hebrew Tetragrammaton (YHWH).
- Appears over 6,800 times in the Old Testament, more than any other name.
- Often read aloud as 'Adonai' in Jewish tradition to preserve the holiness of the
  name.
