number: '030'
word: LORD
gloss: One having power and authority over others; the supreme Sovereign; the Tetragrammaton
  (YHWH).
card_type: TITLE
rarity: GLORIOUS
series: 2026-Q1
set: Babel
art_prompt: A radiant, golden crown hovering over a rough stone altar in a dark void,
  illuminated by a single vertical beam of blinding white light, abstract and majestic
  style.
stats:
  lore: 5
  context: 5
  complexity: 2
ability: Return a card from Sheol to your hand. You may immediately activate it without
  paying its cost.
ot_verse:
  ref: 1 Samuel 2:6
  snippet: The LORD kills and brings to life; he brings down to Sheol and raises up.
nt_verse:
  ref: Philippians 2:11
  snippet: '...and every tongue confess that Jesus Christ is Lord, to the glory of
    God the Father.'
greek:
  text: Κύριος
  translit: Kyrios
hebrew:
  text: יהוה
  translit: YHWH
ot_refs: Ex 3:14 • Deut 6:4 • Ps 23:1 • Isa 42:8
nt_refs: Rom 10:9 • 1 Cor 8:6 • Rev 19:16 • Acts 2:36
trivia:
- In English Bibles, 'LORD' (small caps) denotes the Hebrew name YHWH, while 'Lord'
  translates Adonai.
- The Greek Kyrios was used in the Septuagint for YHWH and later applied to Jesus
  in the New Testament.
- The Tetragrammaton appears over 6,800 times in the Hebrew Bible, often substituted
  vocally with Adonai.
