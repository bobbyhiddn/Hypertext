trivia:
- Rasha is a courtroom word - the one found guilty - before it is a moral one.
- Genesis 6 says the wickedness of man was great in the earth; the flood answers a
  legal verdict.
- Poneros meant toilsome before it meant evil; the Evil One in the Lord's Prayer is
  the same word.
