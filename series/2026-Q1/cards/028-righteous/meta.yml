number: 028
word: RIGHTEOUS
gloss: Acting in accord with divine or moral law; virtuous; free from guilt or sin.
card_type: ADJECTIVE
rarity: GLORIOUS
series: 2026-Q1
set: Babel
art_prompt: A brilliant, vertical beam of white light descending into a dark, chaotic
  ocean, separating the waters perfectly. Geometric, golden, abstract, strictly vertical
  lines.
stats:
  lore: 5
  context: 5
  complexity: 4
ability: Return up to 3 cards from Sheol to your hand.
ot_verse:
  ref: Proverbs 11:8
  snippet: The righteous is delivered from trouble, and the wicked walks into it instead.
nt_verse:
  ref: 2 Corinthians 5:21
  snippet: For our sake he made him to be sin who knew no sin, so that in him we might
    become the righteousness of God.
greek:
  text: δίκαιος
  translit: dikaios
hebrew:
  text: צַדִּיק
  translit: tsaddiq
ot_refs: Gen 6:9 • Gen 15:6 • Prov 10:2 • Ps 1:6 • Hab 2:4
nt_refs: Mt 5:6 • Rom 1:17 • Rom 3:22 • Phil 3:9 • 1 Jn 2:29
trivia:
- The Hebrew 'tsaddiq' implies adherence to a strict standard or plumb line.
- First used in the Bible to describe Noah, who was 'perfect in his generations.'
- In the NT, righteousness is often described as a gift (imputed) rather than earned.
