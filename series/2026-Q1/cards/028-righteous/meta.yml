trivia:
- Genesis 6:9 is the first time anyone in Scripture is called tsaddiq, and it is said
  of a man in a generation about to be drowned.
- Perfect in his generations translates tamim, the word used of an unblemished animal
  brought for sacrifice.
- The just shall live by faith is quoted three times in the New Testament, from one
  half-verse of Habakkuk.
