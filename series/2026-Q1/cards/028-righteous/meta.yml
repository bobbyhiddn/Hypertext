weight: 3
weight_rationale: tsaddiq is thematic vocabulary with real teaching - Noah is the
  first man Scripture calls just - but the adjective is not itself a named agent,
  judgment or event; NOAH and COVENANT carry the era's weight
stats_rationale:
  lore: the verses printed here make righteousness the ground of survival and of life
    itself - just and perfect in his generations, the just shall live by faith; a
    major theme close to doctrine
  context: tsaddiq occurs 206 times in the Hebrew Bible; dikaios occurs 79 times in
    the New Testament; total 285
  complexity: tsaddiq is a legal word - the one the court declares in the right -
    so English must choose between just and righteous where Greek uses one dikaios
    for both; a translation choice to explain
