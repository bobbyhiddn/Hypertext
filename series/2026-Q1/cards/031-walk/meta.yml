number: '031'
word: WALK
gloss: To advance on foot; metaphorically, to conduct one's life, behave, or follow
  a specific course of action.
card_type: VERB
rarity: COMMON
series: 2026-Q1
set: Babel
art_prompt: A pair of worn leather sandals resting on a dusty dirt path that winds
  through a grassy valley toward a distant, glowing horizon. Golden hour lighting,
  realistic style.
stats:
  lore: 3
  context: 5
  complexity: 1
ability: Look at the top 3 cards of the Tower. Put them back in any order.
ot_verse:
  ref: Micah 6:8
  snippet: What does the LORD require of you but to do justice, and to love kindness,
    and to walk humbly with your God?
nt_verse:
  ref: 2 Corinthians 5:7
  snippet: For we walk by faith, not by sight.
greek:
  text: περιπατέω
  translit: peripateo
hebrew:
  text: הָלַךְ
  translit: halakh
ot_refs: Gen 5:24 • Gen 6:9 • Ps 23:4 • Isa 40:31
nt_refs: Eph 4:1 • Eph 5:2 • 1 John 1:7 • 3 John 1:4
trivia:
- The Hebrew root *halakh* forms *Halakhah*, the body of Jewish law, literally meaning
  "the way to walk."
- Enoch and Noah are the only two individuals in the Bible explicitly described as
  having "walked with God."
- The Greek *peripateo* (literally "walk around") is used dozens of times to describe
  one's daily conduct or lifestyle.
