trivia:
- Garash drives out the man from Eden and, in Cain's mouth, drives him from the face
  of the earth - the same verb for both exiles.
- Ekballo casts out demons, and in Mark 1 the Spirit casts Jesus out into the wilderness
  - exile as calling.
- Babel's scattering is the third exile of Genesis; each time the road leads east.
