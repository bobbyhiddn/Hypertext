trivia:
- In the Old Testament, being 'clean' (tahor) was a necessary state required to enter
  the presence of God in the Tabernacle.
- The Greek word 'katharos' is the root of the English word 'catharsis', meaning a
  purification or purging of emotions.
- Jesus redefined cleanness not as an outward ritual washing of the hands, but as
  an inward purity of the heart and mind.
