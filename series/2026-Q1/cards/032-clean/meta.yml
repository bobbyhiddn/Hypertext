trivia:
- In the Old Testament, 'clean' (tahor) often referred to the ritual purity required
  to approach God's presence.
- Jesus redefined cleanness, teaching that true purity comes from a transformed heart
  rather than external rituals.
- The Greek word 'katharos' is the root of the English word 'catharsis', meaning a
  profound emotional cleansing or purification.
