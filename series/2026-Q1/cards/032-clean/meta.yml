nt_refs: Matt 5:8 • Matt 23:26 • John 13:10 • John 15:3 • Jas 1:27
trivia:
- The Hebrew 'tahor' was used for physical cleanliness, ritual purity, and unalloyed
  metals like 'pure gold'.
- In Greek, 'katharos' means unsoiled or free from admixture, giving us the English
  word 'catharsis'.
- Jesus expanded the concept of cleanliness from outward ritual traditions to inward
  moral purity of the heart.
