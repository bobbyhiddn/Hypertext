trivia:
- In the Old Testament, being 'clean' (tahor) was a prerequisite to entering the tabernacle
  or temple.
- Jesus expanded the concept of cleanliness from external ritual purity to internal
  moral purity of the heart.
- The Greek word 'katharos' is the root of the English word 'catharsis', meaning a
  purging or cleansing.
