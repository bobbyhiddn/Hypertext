trivia:
- In the Old Testament, being 'clean' (tahor) was often a state of ritual readiness
  for worship rather than strict moral perfection.
- The Greek word 'katharos' is the root of the English word 'catharsis', which refers
  to an emotional cleansing or purging.
- Jesus radically redefined cleanness for His followers, teaching that true purity
  originates from within the heart, not from outward rituals.
