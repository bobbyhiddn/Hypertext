trivia:
- In the Old Testament, being ritually clean (tahor) was required to enter the tabernacle
  or temple.
- The Greek word 'katharos' is the root of the English word 'catharsis', meaning a
  purification or cleansing.
- Jesus redefined cleanness, teaching that true purity comes from the heart rather
  than external washing.
