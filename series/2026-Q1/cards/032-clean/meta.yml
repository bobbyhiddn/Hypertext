trivia:
- The Hebrew 'tahor' primarily denoted ritual purity, a necessary state for Israelites
  to approach God's tabernacle.
- Jesus expanded the Jewish concept of cleanliness from external, ceremonial washings
  to the internal purity of the heart.
- The Greek word 'katharos' is the root of the English word 'catharsis,' which means
  an emotional or spiritual purification.
