trivia:
- In Levitical law, being 'clean' (tahor) was required to enter God's presence for
  worship.
- Jesus expanded the concept from external ritual purity to internal purity of the
  heart.
- The Greek word 'katharos' is the root of the English word 'catharsis,' meaning a
  cleansing or purging.
