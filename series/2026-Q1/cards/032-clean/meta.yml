trivia:
- In the Old Testament, being ceremonially 'clean' (tahor) was a strict requirement
  for entering the tabernacle or temple presence.
- The Greek word 'katharos' is the root for the English word 'catharsis', meaning
  a deep purification or cleansing.
- Jesus radically redefined cleanness for His followers, teaching that moral purity
  of the heart supersedes external ceremonial washing.
