trivia:
- In the Old Testament, 'clean' often referred to the ceremonial purity required to
  participate in temple worship.
- Jesus expanded the concept of cleanliness from outward rituals and dietary laws
  to inward purity of the heart.
- The Greek word 'katharos' is the root of the English word 'catharsis', meaning a
  purifying release or cleansing.
