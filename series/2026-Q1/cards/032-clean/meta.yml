trivia:
- In the Levitical law, being 'clean' (tahor) was required to enter the tabernacle
  and participate in worship.
- Jesus expanded the concept of cleanliness from external washing rituals to internal
  purity of the heart.
- The Greek word 'katharos' is the root of the English word 'catharsis', meaning a
  purging or emotional cleansing.
