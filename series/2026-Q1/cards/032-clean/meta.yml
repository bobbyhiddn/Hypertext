trivia:
- In the Old Testament, 'tahor' referred to both physical cleanliness and the ceremonial
  purity required for worship.
- The Greek word 'katharos' is the root of the English word 'catharsis', meaning a
  cleansing or purging.
- Jesus expanded the concept of purity beyond external rituals, teaching that true
  cleanness originates in the heart.
