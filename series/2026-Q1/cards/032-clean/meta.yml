trivia:
- In the Levitical system, being ritually 'clean' (tahor) was a strict requirement
  to enter the tabernacle and participate in worship.
- Jesus redefined the concept of cleanness for His followers, teaching that moral
  purity of the heart supersedes external ritual washing.
- The Greek word 'katharos' is the etymological root for the English word 'catharsis',
  which means a purging or cleansing of emotions.
