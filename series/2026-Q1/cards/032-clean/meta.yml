trivia:
- In the Old Testament, being 'clean' (tahor) was a ritual prerequisite for entering
  the tabernacle or temple.
- Jesus expanded the concept of cleanliness from external, ceremonial rituals to internal
  purity of the heart.
- The Greek word 'katharos' is the root of the English word 'catharsis', meaning a
  cleansing or purging.
