trivia:
- The Greek word 'katharos' is the root of the English word 'catharsis,' referring
  to emotional or spiritual cleansing.
- In the Old Testament, the Hebrew 'tahor' describes both physical purity, like refined
  gold, and the ritual cleanness required to approach God.
- Jesus emphasized inner moral purity over external ritual washing, stating that believers
  are made clean through His word.
