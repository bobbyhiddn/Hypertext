trivia:
- In the Old Testament, being 'clean' (tahor) was a strict ritual prerequisite for
  entering the tabernacle or temple.
- The Greek word 'katharos' is the origin of the English word 'catharsis', meaning
  an emotional or spiritual purification.
- Jesus frequently shifted the focus of cleanliness from external, ritual washings
  to internal purity of the heart.
