trivia:
- In the Old Testament, 'clean' (tahor) often referred to ritual purity required to
  enter God's presence, not just physical hygiene.
- Jesus expanded the concept of cleanliness from external, dietary laws to internal,
  moral purity of the heart.
- The Greek word 'katharos' is the root of the English word 'catharsis', meaning a
  purging or cleansing of emotions.
