trivia:
- In the Old Testament, ritual cleanness (tahor) was a strict requirement for entering
  the tabernacle or temple.
- Jesus radically redefined cleanness, teaching that true purity comes from the heart
  rather than external rituals.
- The Greek word 'katharos' is the root of the English word 'catharsis,' meaning a
  deep emotional cleansing.
