trivia:
- In the Old Testament, 'clean' often referred to the ritual purity required to enter
  the temple or participate in worship.
- Jesus expanded the concept of cleanliness from external, ritual washing to internal,
  moral purity of the heart.
- The Greek word 'katharos' is the root of the English word 'catharsis', meaning a
  cleansing or purging of emotions.
