trivia:
- In the Levitical system, being 'clean' (tahor) referred to ritual purity, allowing
  a person to approach the Tabernacle.
- Jesus redefined cleanness, stating that believers are 'already clean' through His
  spoken word.
- The Greek word 'katharos' is the root of the English word 'catharsis,' meaning a
  purging or cleansing.
