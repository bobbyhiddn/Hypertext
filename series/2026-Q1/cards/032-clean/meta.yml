trivia:
- In the Levitical system, being 'clean' (tahor) was required to enter the tabernacle
  and participate in worship.
- Jesus redefined cleanliness, teaching that true purity comes from the heart rather
  than external rituals.
- The Greek word 'katharos' is the root for the English word 'catharsis', meaning
  a purification or purging of emotions.
