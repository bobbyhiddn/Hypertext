trivia:
- In the Old Testament, 'tahor' referred to ritual purity, which was required for
  entering the presence of God.
- Jesus expanded the concept of cleanliness from outward ritual observance to inward
  purity of the heart.
- The Greek word 'katharos' is the root of the English word 'catharsis', meaning a
  cleansing or purification.
