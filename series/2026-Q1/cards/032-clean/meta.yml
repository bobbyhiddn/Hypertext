trivia:
- In the Old Testament, being 'clean' (tahor) often referred to ritual purity required
  to enter God's presence, not just physical hygiene.
- Jesus redefined cleanness, teaching that moral purity radiating from the heart matters
  more than external ritual washing.
- The Greek word 'katharos' is the root for the English word 'catharsis,' meaning
  a purging or cleansing of emotions.
