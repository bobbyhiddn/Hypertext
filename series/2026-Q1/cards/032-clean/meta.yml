trivia:
- In Hebrew, 'tahor' refers not just to physical cleanliness, but to a state of ritual
  and moral purity.
- The Greek 'katharos' is the root of the English word 'catharsis', meaning a purification
  or cleansing.
- Under the Levitical law, being 'clean' was required to approach the presence of
  God in the Tabernacle.
