trivia:
- In the Levitical law, being 'clean' (tahor) was required to enter the tabernacle
  and participate in worship.
- The Greek word 'katharos' is the root for the English word 'catharsis', meaning
  a purification or cleansing.
- Jesus expanded the concept of cleanliness from external ritual washing to internal
  purity of the heart.
