trivia:
- In the Old Testament, 'tahor' describes both ritual purity (like clean animals)
  and moral purity (a clean heart).
- The Greek 'katharos' literally means 'without admixture' or unmixed, like pure gold
  or a vine pruned of dead branches.
- Jesus declared His disciples 'clean' not through ritual washing, but through the
  words He had spoken to them.
