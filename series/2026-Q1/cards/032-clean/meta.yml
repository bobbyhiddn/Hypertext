trivia:
- In the Old Testament, the concept of being 'clean' (tahor) applied to animals, objects,
  and people, determining fitness for temple worship.
- Jesus expanded the definition of cleanliness from external ritual purity to internal
  moral purity of the heart.
- The Greek word 'katharos' is the root of the English word 'catharsis,' meaning a
  cleansing or purging of emotions.
