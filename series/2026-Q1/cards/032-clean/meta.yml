trivia:
- In the Levitical system, being 'clean' (tahor) was a strict prerequisite to enter
  the tabernacle and participate in worship.
- Jesus famously shifted the theological focus of cleanliness from external ritual
  washing to internal moral purity.
- The Greek word 'katharos' is the origin of the English word 'catharsis', meaning
  a profound emotional or spiritual cleansing.
