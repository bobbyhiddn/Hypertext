trivia:
- In the Old Testament, ritual cleanliness was required for Israelites to participate
  in worship at the tabernacle.
- Jesus shifted the focus of cleanliness from external, ceremonial washing to internal
  purity of the heart.
- The Greek word 'katharos' is the root of the English word 'catharsis,' which means
  a cleansing or purging.
