trivia:
- The Hebrew 'tahor' applies to both ceremonial ritual purity and internal moral innocence.
- In the ancient Near East, being ritually 'clean' was a strict prerequisite to entering
  the temple presence.
- Jesus expanded the concept of cleanliness from external washing rituals to internal
  heart attitudes.
