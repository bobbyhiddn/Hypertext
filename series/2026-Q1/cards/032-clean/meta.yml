trivia:
- In Levitical law, being 'clean' was a strict prerequisite to enter the tabernacle
  and approach God's presence.
- The Greek word 'katharos' is the origin of the English word 'catharsis', meaning
  a deep emotional purging or cleansing.
- Jesus radically redefined cleanness, teaching that moral purity of the heart supersedes
  outward ceremonial washing.
