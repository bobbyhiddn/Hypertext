trivia:
- In Levitical law, physical and ritual cleanness was a strict prerequisite for entering
  the tabernacle.
- The Greek word 'katharos' is the root of the English word 'catharsis', meaning an
  emotional purification.
- Jesus radically taught that true cleanness originates from the heart, rather than
  from external washing rituals.
