trivia:
- In the Old Testament, being 'clean' often referred to the ritual purity required
  to enter the tabernacle or temple.
- Jesus controversially declared all foods clean, shifting the focus from external
  dietary laws to internal heart purity.
- The Greek word 'katharos' is the direct root of the English word 'catharsis', which
  means a deep emotional cleansing or purging.
