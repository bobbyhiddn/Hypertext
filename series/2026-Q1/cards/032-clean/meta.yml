trivia:
- In Levitical law, 'clean' (tahor) designated animals acceptable for food and animals
  without blemish acceptable for sacrifice.
- Jesus expanded the concept of cleanliness from outward ritual purity to the moral
  and spiritual purity of the heart.
- The Greek word 'katharos' is the root of the English word 'catharsis', meaning an
  emotional or spiritual purification.
