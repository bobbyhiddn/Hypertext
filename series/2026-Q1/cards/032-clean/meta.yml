trivia:
- In the Old Testament, being 'clean' often referred to the ritual purity required
  to enter the tabernacle or temple.
- The Greek word 'katharos' is the root of the English word 'catharsis', meaning a
  profound cleansing or purification.
- Jesus radically shifted the focus of cleanliness from external ritual washings to
  the internal purity of the heart.
