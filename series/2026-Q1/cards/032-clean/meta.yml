trivia:
- In the Old Testament, ritual cleanness (tahor) was required to enter the tabernacle
  or participate in worship.
- The Greek word 'katharos' is the root of the English word 'catharsis', meaning a
  purging or cleansing.
- Jesus redefined cleanness for His followers, teaching that moral purity of the heart
  supersedes external ritual washing.
