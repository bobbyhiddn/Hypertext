trivia:
- In the Old Testament, being 'clean' (tahor) was a prerequisite for participating
  in temple worship and community life.
- Jesus expanded the concept of cleanliness from external, ritual purity to internal,
  moral purity of the heart.
- The Greek word 'katharos' is the root of the English word 'catharsis', which refers
  to an emotional cleansing or purification.
