trivia:
- In Levitical law, 'tahor' referred to the ritual purity required to approach the
  tabernacle or participate in worship.
- Jesus expanded the concept of cleanliness from external rituals to the internal
  purity of the heart.
- The Greek word 'katharos' is the root of the English word 'catharsis', meaning a
  purification or cleansing.
