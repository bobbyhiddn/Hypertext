trivia:
- Under the Levitical law, being ceremonially 'clean' (tahor) was required to enter
  the presence of God in the tabernacle.
- Jesus radically shifted the focus of cleanliness from external rituals to internal
  purity of the heart.
- The Greek word 'katharos' is the origin of the English word 'catharsis', meaning
  a profound emotional or spiritual cleansing.
