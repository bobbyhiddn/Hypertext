ot_verse:
  ref: Psalm 51:10
  snippet: Create in me a clean heart, O God, and renew a right spirit within me.
nt_verse:
  ref: John 15:3
  snippet: Already you are clean because of the word that I have spoken to you.
greek:
  text: καθαρός
  translit: katharos
hebrew:
  text: טָהוֹר
  translit: tahor
ot_refs: Lev 11:47 • Ps 24:4 • Ezek 36:25
nt_refs: Matt 5:8 • John 13:10 • Titus 1:15
trivia:
- In the Old Testament, 'tahor' often referred to the ritual purity required to enter
  the Tabernacle or consume certain foods [1.8].
- In the New Testament, Jesus emphasized that true cleanness comes from within the
  heart, rather than just outward ceremonial washing.
- The Greek word 'katharos' is related to the English words 'chaste' and 'chasten,'
  reflecting a state free from corrupt desire or guilt.
