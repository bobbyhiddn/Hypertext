trivia:
- In the Old Testament, ritual cleanness was required to enter the tabernacle and
  approach God's presence.
- The Greek word 'katharos' is the root for the English word 'catharsis', meaning
  a purification or cleansing.
- Jesus redefined cleanness, teaching that moral purity of the heart supersedes external
  dietary laws.
