trivia:
- In the Old Testament, being 'clean' (tahor) primarily referred to ritual readiness
  to safely enter God's presence.
- Jesus expanded the concept of cleanliness from external, ritualistic washing to
  internal purity of the heart.
- The Greek word 'katharos' is the root for the English word 'catharsis', which means
  a cleansing or purging.
