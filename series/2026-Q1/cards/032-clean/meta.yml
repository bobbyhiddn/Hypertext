trivia:
- In the Old Testament, 'tahor' primarily denoted ritual purity required for worship,
  rather than physical hygiene.
- Jesus taught that true cleanliness comes from within, prioritizing moral purity
  of the heart over external washing.
- The Greek word 'katharos' is the origin of the English word 'catharsis', meaning
  a purging or purification.
