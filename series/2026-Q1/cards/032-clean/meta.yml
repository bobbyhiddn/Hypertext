trivia:
- In the Old Testament, being 'clean' (tahor) was often a ritual status required for
  worship, distinct from moral purity.
- Jesus expanded the concept of cleanliness, teaching that true defilement comes from
  within the heart.
- The Greek word 'katharos' is the root of the English word 'catharsis', meaning an
  emotional purging or cleansing.
