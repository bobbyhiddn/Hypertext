trivia:
- The Greek word 'katharos' is the root of the English word 'catharsis,' meaning a
  deep cleansing or purification.
- In the Old Testament, being ritually 'clean' (tahor) was a strict requirement for
  entering God's presence in the tabernacle.
- In John 15, Jesus uses a wordplay where the Greek word for 'clean' is also used
  for 'pruning' a vine to make it fruitful.
