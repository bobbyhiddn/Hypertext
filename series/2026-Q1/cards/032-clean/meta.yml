trivia:
- In the Old Testament, 'tahor' often referred to the ceremonial purity required to
  enter God's presence.
- Jesus expanded the concept of cleanness from outward ritual washing to inward purity
  of the heart.
- The Greek word 'katharos' is the root of the English word 'catharsis', meaning a
  cleansing or purging.
