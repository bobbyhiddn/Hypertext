trivia:
- In the Old Testament, 'tahor' primarily described the ritual purity required to
  enter the tabernacle or temple.
- The Greek word 'katharos' is the origin of the English word 'catharsis', meaning
  an emotional or spiritual purification.
- Jesus shifted the biblical focus of cleanness from external dietary laws to the
  moral purity of the heart.
