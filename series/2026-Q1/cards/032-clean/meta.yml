trivia:
- In Levitical law, being 'clean' was a strict requirement to enter the tabernacle
  and approach God.
- The Greek word 'katharos' is the root of the English word 'catharsis', referring
  to a purifying emotional cleanse.
- Jesus consistently expanded the concept of cleanliness from external, physical rituals
  to internal purity of the heart.
