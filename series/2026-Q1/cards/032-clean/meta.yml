trivia:
- The Hebrew word 'tahor' is used extensively in Leviticus to describe the ritual
  purity required to enter God's presence.
- In the New Testament, Jesus redefines 'clean' (katharos) as an inward state of the
  heart rather than mere external ritual.
- The biblical concept of becoming clean is closely tied to physical water rituals,
  prefiguring the Christian practice of baptism.
