trivia:
- The Hebrew 'tahor' conveyed both ritual purity for Temple worship and moral purity
  of the heart [1.8].
- Jesus expanded the Levitical concept of cleanness, teaching that true purity comes
  from within rather than external rituals.
- The Greek 'katharos' (clean, pure) is the root of the English word 'catharsis',
  meaning a purification or purging of emotions.
