trivia:
- In the Old Testament, 'clean' often referred to the ritual purity required to enter
  the tabernacle or temple for worship.
- Jesus radically redefined cleanliness as an internal state of the heart rather than
  external adherence to dietary or washing rules.
- The Greek word 'katharos' is the origin of the English word 'catharsis', meaning
  a purging or cleansing.
