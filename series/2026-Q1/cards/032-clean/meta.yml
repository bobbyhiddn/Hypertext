trivia:
- In the Old Testament, being 'clean' (tahor) was often a state of ritual readiness
  for worship rather than a measure of moral perfection.
- Jesus redefined cleanness for His followers, teaching that moral purity flowing
  from the heart supersedes external ritual washing.
- The Greek word 'katharos' is the root for the English word 'catharsis,' which refers
  to a deep emotional cleansing or purging.
