trivia:
- The Hebrew word 'tahor' referred to ritual readiness to enter God's presence, not
  merely physical hygiene.
- Jesus used the Greek 'katharos' to emphasize internal purity, declaring His disciples
  clean through His spoken word.
- In the Levitical system, being 'unclean' was often a temporary ritual state resolved
  by washing and waiting until evening.
