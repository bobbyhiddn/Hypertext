trivia:
- In the Old Testament, 'tahor' referred to both physical cleanliness and the ritual
  purity required for worship.
- Jesus expanded the concept of cleanliness from external levitical rituals to internal
  purity of the heart.
- The Greek word 'katharos' is the origin of the English word 'catharsis', meaning
  a deep emotional purging or cleansing.
