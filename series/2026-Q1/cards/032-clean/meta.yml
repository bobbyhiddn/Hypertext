trivia:
- In the Old Testament, 'clean' (tahor) often referred to the ritual purity required
  to safely enter the presence of God at the tabernacle.
- Jesus expanded the concept of cleanliness from external, ceremonial rituals to internal,
  moral purity of the heart.
- The Greek word 'katharos' is the origin of the English word 'catharsis', which refers
  to a profound emotional purging or cleansing.
