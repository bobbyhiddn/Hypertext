trivia:
- The Greek 'katharos' literally means 'without admixture' or unalloyed, often used
  in antiquity to describe pure metals.
- The Hebrew 'tahor' primarily described the ritual purity required for Israelites
  to safely approach the Tabernacle.
- Jesus frequently challenged the religious elite by prioritizing inward moral cleanness
  over outward ritual washing.
