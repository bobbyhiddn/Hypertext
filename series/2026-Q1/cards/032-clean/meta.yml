trivia:
- In the Old Testament, 'clean' (tahor) often referred to the ritual purity required
  to enter God's presence or participate in worship.
- Jesus radically shifted the focus of cleanliness from external, dietary rituals
  to internal, moral purity of the heart.
- The Greek word 'katharos' is the root of the English word 'catharsis', which means
  a purging or cleansing.
