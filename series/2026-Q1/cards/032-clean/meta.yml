trivia:
- In the Old Testament, the Hebrew word 'tahor' was often used for ritual purity,
  describing animals, vessels, and people fit for worship.
- Jesus uses the Greek 'katharos' in John 15:3, creating a wordplay with 'kathairo'
  (to prune or cleanse) in the previous verse.
- David's plea for a 'clean heart' in Psalm 51:10 shifts the concept of cleanliness
  from external ritual to internal, spiritual transformation.
