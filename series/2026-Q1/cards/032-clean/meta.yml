trivia:
- The Hebrew word 'tahor' describes both physical cleanliness and the ritual purity
  required to enter God's presence.
- The Greek word 'katharos' is the root of the English word 'catharsis', meaning a
  purification or cleansing.
- In John 15, Jesus tells His disciples they are 'already clean' because of the word
  He has spoken to them.
