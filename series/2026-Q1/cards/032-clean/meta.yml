trivia:
- In Levitical law, 'tahor' described the ritual purity required to approach God's
  presence.
- Jesus consistently shifted the biblical focus of cleanliness from external washings
  to internal moral purity.
- The Greek word 'katharos' is the origin of the English word 'catharsis', meaning
  a purifying release.
