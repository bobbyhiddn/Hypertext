trivia:
- In John 15, the Greek word for 'clean' (katharos) shares a root with the verb for
  'prune' (kathairo).
- David's plea for a clean heart in Psalm 51 uses 'bara', the same Hebrew verb used
  for God's creation of the cosmos.
- Under the Mosaic law, maintaining physical and ritual cleanliness was a prerequisite
  for participating in tabernacle worship.
