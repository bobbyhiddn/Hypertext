trivia:
- In the Old Testament, the Hebrew word 'tahor' often referred to the ritual purity
  required to enter God's presence in the tabernacle.
- Jesus expanded the concept of cleanliness, telling His disciples they were 'already
  clean' because of His teachings.
- The Greek word 'katharos' (clean or pure) is the root of the English word 'catharsis',
  meaning a purging or purification.
