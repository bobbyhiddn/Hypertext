trivia:
- The Hebrew word 'tahor' applies to both physical cleanliness, like pure gold, and
  ritual purity.
- The Greek word 'katharos' is the root of the English word 'catharsis,' meaning a
  purging or cleansing.
- In the biblical worldview, being 'clean' was closely associated with life and holiness,
  while 'unclean' was tied to death and decay.
