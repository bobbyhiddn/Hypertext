trivia:
- In Levitical law, being 'clean' (tahor) referred to the ritual purity required to
  safely approach the tabernacle and God's presence.
- The Greek word 'katharos' is the root of the English word 'catharsis,' which means
  a profound emotional purification or cleansing.
- Jesus radically redefined cleanness for His followers, teaching that true purity
  originates from the heart rather than external washing rituals.
