trivia:
- In Hebrew, 'tahor' refers to ritual purity, a state required to approach God's presence
  or the Tabernacle.
- The Greek 'katharos' was used for clean water, pure metals, and a heart free from
  the contamination of sin.
- Jesus challenged the Pharisees by teaching that true cleanness comes from within,
  not just outward ritual washing.
