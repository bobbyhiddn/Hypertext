trivia:
- In the Old Testament, being 'clean' (tahor) was a strict prerequisite for entering
  the presence of God in the tabernacle.
- Jesus radically shifted the focus of cleanliness from external ritual washing to
  the internal moral purity of the heart.
- The Greek word 'katharos' is the origin of the English word 'catharsis', meaning
  an emotional or spiritual purification.
