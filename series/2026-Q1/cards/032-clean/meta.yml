trivia:
- In the Old Testament, being 'clean' often referred to the ritual purity required
  to enter the temple, rather than just physical hygiene.
- Jesus expanded the concept of cleanliness from external rituals to internal moral
  purity of the heart.
- The Greek word 'katharos' is the root for the English word 'catharsis', meaning
  a cleansing or purging of emotions.
