trivia:
- In the Old Testament, 'clean' (tahor) often referred to ritual purity required to
  enter the tabernacle or temple.
- Jesus expanded the concept of cleanliness from outward ritual to inward purity of
  the heart.
- The Greek word 'katharos' is the root of the English word 'catharsis', meaning a
  purifying or cleansing of emotions.
