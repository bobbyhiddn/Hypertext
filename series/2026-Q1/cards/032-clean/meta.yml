trivia:
- In the Old Testament, being 'clean' often referred to ritual readiness to enter
  God's presence, not just physical hygiene.
- Jesus expanded the concept of cleanliness from external rituals to internal purity
  of the heart.
- The Greek word 'katharos' is the root of the English word 'catharsis', meaning a
  purifying or cleansing of emotions.
