trivia:
- In the Levitical law, being 'clean' was a prerequisite for entering the tabernacle
  and participating in worship.
- Jesus radically shifted the focus of cleanness from external ritual washing to internal
  purity of the heart.
- The Greek word 'katharos' is the root for the English word 'catharsis', meaning
  a purging or cleansing.
