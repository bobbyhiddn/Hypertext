trivia:
- In the Old Testament, 'clean' (tahor) often referred to the ritual purity required
  to enter God's presence.
- Jesus expanded the concept of cleanliness from external rituals to internal purity
  of the heart.
- The Greek word 'katharos' is the root of the English word 'catharsis', meaning a
  cleansing or purification.
