trivia:
- In the Old Testament, being 'clean' (tahor) was a strict ritual prerequisite to
  enter the tabernacle or temple.
- Jesus expanded the concept of cleanliness from external ritual washings to internal
  purity of the heart.
- The Greek word 'katharos' is the root of the English word 'catharsis', meaning a
  purging or emotional cleansing.
