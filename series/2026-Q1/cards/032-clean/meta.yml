trivia:
- In the Levitical law, being 'clean' (tahor) was a prerequisite to enter the tabernacle
  and participate in worship.
- The Greek word 'katharos' is the root for the English word 'catharsis', meaning
  a purification or emotional cleansing.
- Jesus radically redefined cleanness, teaching that true purity comes from within
  the heart rather than through external washing rituals.
