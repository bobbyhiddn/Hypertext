trivia:
- Under the Mosaic Law, being ritually 'clean' was a strict requirement to participate
  in temple worship.
- Jesus elevated the concept of cleanness from outward ritual purification to an internal
  state of the heart.
- The Greek word 'katharos' is the linguistic root of the English word 'catharsis',
  meaning a purification or purging.
