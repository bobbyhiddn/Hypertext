trivia:
- The Greek word 'katharos' is the root of the English word 'catharsis,' meaning an
  emotional cleansing or purification.
- In the Old Testament, the Hebrew 'tahor' often described ritual purity, which was
  required to safely enter God's presence at the Tabernacle.
- Jesus expanded the concept of cleanliness from external rituals to internal purity,
  declaring 'Blessed are the pure in heart' (Matthew 5:8).
