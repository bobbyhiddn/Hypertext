revision_notes: 'General revision request (you may modify any content field as needed):

  remove parenthesis the greek and hebrew transliterations

  # Card_Word: EARTH

  # Card_Gloss: The dry land, ground, or soil; the material world distinct from the
  heavens.

  # Card_Type: NOUN

  # Card_Rarity: COMMON

  # Card_Ability: Look at the top 2 cards of the Tower. Add 1 to your hand and put
  the other on the bottom.

  # Card_Stats: LORE 2 | CONTEXT 5 | COMPLEXITY 1

  # Card_Art_Prompt: A pair of weathered hands holding a sphere of rich, dark soil
  that is crumbling slightly, with a faint glow emanating from the cracks, set against
  a void.

  # Card_OT_Verse: Genesis 1:1 — In the beginning God created the heaven and the earth.

  # Card_NT_Verse: Matthew 5:5 — Blessed are the meek: for they shall inherit the
  earth.

  # Card_Hebrew: אֶרֶץ (''Eretz)

  # Card_Greek: γῆ (Gē)

  # Card_Trivia_1: The Hebrew word ''eretz'' appears over 2,500 times in the Old Testament.

  # Card_Trivia_2: Adam''s name is derived from ''adamah'', meaning ground or earth.

  # Card_Trivia_3: Ancient cosmology often depicted the earth as a foundation set
  upon pillars.'
weight: 2
weight_rationale: the ground the whole era is played out on - corrupted, flooded,
  dried and repopulated - but the word is the setting rather than a named agent, place
  or event the era turns on, so it stays at 2 and prints COMMON
stats_rationale:
  lore: the printed verses charge the earth itself with corruption before the flood
    and promise it to the meek as an inheritance - a recognized theme of the era with
    clear teaching, though the doctrine hangs on judgment and promise rather than
    on the ground
  context: eretz occurs 2504 times in the Hebrew Bible; ge occurs 250 times in the
    New Testament; total 2754
  complexity: eretz is at once the whole earth and one particular country, so the
    same word is world in Genesis 1:1 and land in the land of Canaan, and a translator
    must choose which is meant almost line by line
