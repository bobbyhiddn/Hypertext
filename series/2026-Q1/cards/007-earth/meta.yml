trivia:
- 'Genesis 6:11 charges the earth itself, not only the people on it: the ground is
  corrupt before God and filled with violence.'
- Eretz is both the planet and a parcel of it - the earth of Genesis 1:1 and the land
  of Canaan are the same noun.
- Matthew 5:5 quotes Psalm 37:11, where the inheritance promised is eretz, the land;
  the meek inherit either a country or the whole world depending on which word you
  hear.
