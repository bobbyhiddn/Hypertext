trivia:
- Hagar is the first person in Scripture to give God a name - Thou God seest me.
- The angel's command is to return and submit; the promise of a multitude comes only
  after the going back.
- Paul makes Hagar and Sarah two covenants, which is why a handmaid of Genesis argues
  a point in Galatians.
