weight_rationale: the son the promise runs through and the pun the Babel account turns
  on - thematic vocabulary with real teaching; the patriarchs the era turns on are
  Noah and Abram, so Shem stays at 3 and prints UNCOMMON
stats_rationale:
  lore: the printed verses bless the God of Shem and seat him in a genealogy - a recognized
    theme of the era, since the promise travels his line, but the teaching rests on
    the promise rather than the man
  context: Shem occurs 17 times in the Hebrew Bible; Sem occurs 1 time in the New
    Testament; total 18
  complexity: his name is simply the noun name, so Genesis 11 sets a people who say
    let us make us a name against the line already called Name; and Genesis 9:26 blesses
    the God of Shem rather than Shem, a construction commentators have argued over
    for centuries
