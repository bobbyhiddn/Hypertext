trivia:
- In the Old Testament, 'tamim' is frequently used to describe the strict requirement
  that sacrificial animals be entirely without physical blemish.
- Job is introduced as a 'blameless and upright' man, demonstrating that biblical
  blamelessness refers to relational integrity, not sinless perfection.
- The Greek word 'amemptos' was used in civic contexts to describe a citizen whose
  life left no room for legitimate public accusation.
