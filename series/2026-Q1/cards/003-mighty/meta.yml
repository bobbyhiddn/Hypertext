weight: 3
weight_rationale: the gibborim of Genesis 6 and Nimrod the mighty one are how the
  era names raw human power before the flood and after it - thematic vocabulary with
  real teaching, but the word describes a kind of man rather than naming an agent
  or event the era turns on, so it stays at 3 and prints UNCOMMON
stats_rationale:
  lore: the printed verses give the mighty men of old, men of renown, and the Magnificat's
    he that is mighty - a recognized theme of the era with clear teaching, though
    the doctrine rests on who is mighty rather than on the adjective
  context: gibbor occurs 159 times in the Hebrew Bible; dunatos occurs 32 times in
    the New Testament; total 191
  complexity: gibbor is at once a warrior, a champion, a tyrant and, in El Gibbor,
    a name of God, so the same word praises and accuses; dunatos likewise slides between
    able, powerful and possible, and Greek must choose which each time
