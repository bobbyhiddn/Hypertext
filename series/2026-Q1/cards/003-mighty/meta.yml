trivia:
- Genesis 6:4 calls the mighty men anshei hashem, men of the name - two chapters before
  Babel's builders set out to make themselves a name.
- Nimrod is the first man in Scripture called gibbor, and the text says he began to
  be one, as though might were something a man works up to.
- The same adjective stands in Isaiah's El Gibbor, the Mighty God, so Hebrew praise
  and Hebrew menace share one word.
