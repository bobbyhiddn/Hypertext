trivia:
- The Hebrew word 'ra' describes moral wickedness, but is also frequently used to
  describe natural disasters or physical harm.
- In the Lord's Prayer, 'deliver us from evil' uses a form of 'ponēros' that can be
  translated personally as 'the evil one'.
- Biblically, evil is not an eternal opposing force equal to God, but rather a corruption
  or absence of God's good creation.
