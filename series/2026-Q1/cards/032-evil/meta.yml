- In the Lord's Prayer, the Greek phrase for 'deliver us from evil' can also be accurately
  translated as 'deliver us from the evil one'.
- Biblical authors frequently contrast evil directly with elemental concepts like
  light, life, and truth to emphasize its corrupting nature.
