trivia:
- The Hebrew word 'ra' can describe moral wickedness, but is also frequently used
  for natural disasters, calamity, or distress.
- In the Lord's Prayer (Matthew 6:13), the Greek 'ponēros' can be translated as the
  abstract concept of 'evil' or personified as 'the evil one'.
- Isaiah 5:20 pronounces a severe woe on those who distort reality by reversing moral
  categories, calling evil good and good evil.
