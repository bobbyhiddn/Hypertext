trivia:
- The Hebrew word 'ra' encompasses not only moral wickedness, but also natural disaster,
  calamity, and distress.
- In the Lord's Prayer, 'deliver us from evil' can also be accurately translated from
  Greek as 'the evil one'.
- Isaiah 45:7 uses 'ra' to describe God bringing 'calamity' or 'disaster' as a judgment,
  rather than moral evil.
