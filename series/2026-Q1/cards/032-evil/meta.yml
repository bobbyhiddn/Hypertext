trivia:
- The Hebrew word 'ra' is used for both moral wickedness and the calamitous consequences
  or disasters brought as judgment [1.1.8].
- Greek distinguishes between 'kakos' (a passive lack of goodness) and 'ponēros' (an
  active, malicious, and corrupting evil).
- Isaiah 5:20 warns against moral inversion, pronouncing a strict 'woe' on those who
  celebrate evil as good.
