trivia:
- The Hebrew word 'ra' encompasses moral wickedness as well as physical calamity,
  distress, and injury.
- The Greek 'ponēros' emphasizes active, malignant evil that spreads pain and corruption,
  rather than just bad character.
- In the Lord's Prayer, the phrase 'deliver us from evil' uses 'ho ponēros', which
  can also be translated as 'the evil one.'
