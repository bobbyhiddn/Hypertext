trivia:
- In Hebrew, 'ra' can refer to moral wickedness, but is also used to describe natural
  disasters, calamity, or physical harm.
- The Greek word 'ponēros' implies an active, malignant corruption that seeks to drag
  others down, rather than just passive badness.
- Biblically, evil is often depicted not as an equal opposite to God, but as a parasitic
  corruption of His originally good creation.
