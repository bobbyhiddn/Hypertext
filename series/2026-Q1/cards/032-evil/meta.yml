trivia:
- In Hebrew, 'ra' can refer to moral wickedness, but also natural disaster, calamity,
  or distress.
- The Greek 'ponēros' emphasizes active, harmful evil, distinguishing it from 'kakos'
  (general badness).
- In the original Greek of the Lord's Prayer, 'deliver us from evil' can also be translated
  as 'the evil one'.
