trivia:
- In Hebrew, 'ra' can refer to moral wickedness, but it is also frequently used to
  describe natural disasters, calamity, or physical harm.
- The Greek 'ponēros' emphasizes an active, malignant evil that seeks to corrupt others,
  often contrasting with 'kakos' (which can mean base or worthless).
- Biblical authors frequently describe evil not as an independent force, but as a
  corruption or privation of the inherent goodness of God's creation.
