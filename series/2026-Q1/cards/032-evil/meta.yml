trivia:
- In biblical Hebrew, 'ra' can refer to moral wickedness, but it is also frequently
  used to describe physical calamity or disaster.
- The Greek word 'ponēros' emphasizes the active, corrupting nature of evil, rather
  than just the passive absence of good.
- When Isaiah 45:7 states that God creates 'evil' (ra), context shows it refers to
  bringing judgment or disaster, not moral sin.
