trivia:
- In Hebrew, 'ra' (רַע) encompasses not just moral wickedness, but also physical calamity,
  distress, and harm.
- The Greek word 'ponēros' (πονηρός) emphasizes active, malignant evil that spreads
  like a disease, distinguishing it from general badness.
- In the Lord's Prayer, the phrase 'deliver us from evil' uses 'ponēros', which can
  also be translated personally as 'the evil one'.
