trivia:
- In Hebrew, 'ra' can refer to moral wickedness, but also to physical calamity, dysfunction,
  or distress.
- The Greek 'kakos' describes something inherently bad or harmful, while 'ponēros'
  emphasizes active, spreading malice.
- Ancient Hebrew thought often contrasted 'ra' (dysfunctional) with 'tov' (functional)
  rather than strictly as spiritual opposites.
