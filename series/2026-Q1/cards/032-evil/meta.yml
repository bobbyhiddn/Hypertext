trivia:
- In Hebrew, 'ra' can refer to moral wickedness, but is also frequently used to describe
  physical calamity, disaster, or distress.
- The Greek word 'ponēros' emphasizes an active, corrupting, and malignant kind of
  evil, rather than mere passive badness.
- Throughout Scripture, evil is consistently depicted not as a created substance,
  but as the perversion or absence of God's good order.
