trivia:
- In Hebrew, 'ra' can refer to moral wickedness, but is also frequently used to describe
  natural disasters, distress, or calamity.
- The Greek word 'ponēros' emphasizes an active, malignant kind of evil that intentionally
  seeks to corrupt others.
- In the Lord's Prayer, the petition 'deliver us from evil' is grammatically ambiguous
  and is often translated as 'deliver us from the evil one.'
