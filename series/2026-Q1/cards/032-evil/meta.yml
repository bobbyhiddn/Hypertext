trivia:
- The Hebrew word 'ra' can mean moral wickedness, but is also used to describe physical
  disaster or distress.
- In the Lord's Prayer, the Greek 'ponēros' can be translated as the abstract concept
  of 'evil' or personified as 'the evil one'.
- Biblical authors often contrast evil with good, portraying it not just as the absence
  of good, but as an active, corrupting force.
