trivia:
- The Hebrew word 'ra' is used extensively in the Old Testament to describe both moral
  wickedness and physical calamity or disaster.
- In the Greek New Testament, 'ponēros' implies an active, corrupting malice that
  seeks to drag others down into ruin.
- The famous petition 'deliver us from evil' in the Lord's Prayer (Matthew 6:13) can
  also be grammatically translated as 'deliver us from the evil one'.
