trivia:
- From Old English 'yfel', originally meaning 'exceeding proper limits' or 'vicious'.
- Greek 'poneros' implies active, harmful wickedness, while 'kakos' refers to bad
  nature.
- Theodicy is the theological study attempting to reconcile God's goodness with the
  existence of evil.
