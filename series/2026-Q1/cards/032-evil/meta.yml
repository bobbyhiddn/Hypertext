trivia:
- The Hebrew word 'ra' can denote moral wickedness, but is also used for dysfunction,
  disaster, or physical harm.
- In Greek, 'ponēros' describes active, malignant evil that causes harm, contrasting
  with 'kakos' (inherent badness).
- In the Lord's Prayer, 'deliver us from evil' uses 'ponēros,' which many scholars
  translate personally as 'the evil one.'
