trivia:
- The Hebrew word 'ra' is first used in Genesis to describe the Tree of the Knowledge
  of Good and Evil.
- In Greek, 'ponēros' implies an active, malignant, and corrupting evil, distinct
  from 'kakos' which is a more general badness.
- The phrase 'the evil one' in the New Testament is derived from 'ho ponēros', personifying
  active rebellion against God.
