trivia:
- The Hebrew word 'ra' is used for moral wickedness, but is also frequently translated
  as physical harm, disaster, or calamity.
- In the Lord's Prayer, the Greek 'ponēros' can be translated as the abstract concept
  of 'evil' or personified as 'the evil one.'
- Christian theology historically defines evil not as an independent substance, but
  as a privation or corruption of God's originally good creation.
