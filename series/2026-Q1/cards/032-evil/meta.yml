trivia:
- In Hebrew, 'ra' can denote moral wickedness, but is also frequently used to describe
  natural disasters, distress, or calamity.
- The Greek word 'ponēros' emphasizes the active, malignant, and corrupting nature
  of evil, rather than just a passive flaw.
- In the Lord's Prayer, the Greek phrase 'deliver us from evil' can also be accurately
  translated as 'deliver us from the evil one.'
