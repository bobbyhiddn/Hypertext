trivia:
- In Hebrew, 'ra' (evil) encompasses not only moral wickedness but also physical calamity,
  distress, and dysfunction.
- The Greek 'ponēros' emphasizes an active, malignant evil that causes pain and destruction,
  distinct from passive badness.
- Scripture often contrasts evil with good, commanding believers to 'abhor' or shudder
  away from wickedness.
