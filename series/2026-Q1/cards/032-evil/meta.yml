trivia:
- The Hebrew 'ra' encompasses both moral wickedness and physical calamity or disaster.
- Greek 'poneros' implies active, harmful evil, often personified as 'The Evil One'
  (Satan).
- In Isaiah 45:7, God 'creating evil' refers to His sovereignty over disaster and
  judgment, not sin.
