trivia:
- The Hebrew 'ra' encompasses not just moral wickedness, but also physical calamity,
  distress, and harm.
- In Greek, 'ponēros' describes an active, spreading malice that seeks to drag others
  down with it.
- The biblical concept of evil is not an equal opposite force to good, but a corruption
  of God's good design.
