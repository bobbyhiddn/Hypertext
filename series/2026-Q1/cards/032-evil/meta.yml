trivia:
- The Hebrew word 'ra' can describe moral wickedness, but also physical calamity,
  disaster, or dysfunction.
- In Greek, 'ponēros' emphasizes an active, malignant form of evil that causes pain
  and destruction.
- Biblically, evil is not an equal opposite force to God, but a corruption and distortion
  of His good creation.
