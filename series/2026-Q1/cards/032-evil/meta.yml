trivia:
- The Greek word 'ponēros' refers to active, malignant evil that causes pain and sorrow,
  rather than just general badness.
- In Hebrew, 'ra' can refer to moral wickedness, but also to physical calamity, disaster,
  or distress.
- The phrase 'the evil one' in the New Testament specifically uses 'ponēros' to describe
  Satan's active rebellion.
