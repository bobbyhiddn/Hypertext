trivia:
- The Hebrew word 'ra' can refer to moral wickedness, but is also frequently used
  to describe physical harm, disaster, or distress.
- 'In the Lord''s Prayer (Matthew 6:13), the Greek adjective ''ponēros'' is articulated,
  leading many to translate it as a personification: ''the evil one''.'
- When Isaiah 45:7 says God creates 'evil' (KJV), the word 'ra' is used in the sense
  of bringing 'calamity' or 'disaster' in judgment, not moral sin.
