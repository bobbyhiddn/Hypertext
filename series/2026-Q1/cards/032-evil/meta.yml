trivia:
- In the Old Testament, the Hebrew word 'ra' can denote moral wickedness, but it is
  also frequently translated as physical calamity or disaster.
- Jesus frequently personified evil as 'the evil one' (ho ponēros), pointing to a
  conscious, spiritual adversary rather than just an abstract concept.
- Biblical authors continually contrast evil with light, truth, and the inherent goodness
  of God's original creation.
