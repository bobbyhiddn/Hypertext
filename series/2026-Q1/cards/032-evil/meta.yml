trivia:
- The Greek word 'ponēros' implies an active, malignant evil, while 'kakos' refers
  to a base or deeply flawed character.
- In Hebrew, 'ra' can describe moral wickedness, but also physical calamity, distress,
  or a harmful outcome.
- The Bible does not treat evil as an eternal counterpart to good, but as a corruption
  of God's original, good creation.
