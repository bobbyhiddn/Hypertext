trivia:
- The Hebrew word 'ra' can denote moral wickedness, but is also frequently used to
  describe physical disaster or calamity.
- In Greek, 'ponēros' emphasizes active, harmful malice and corruption, rather than
  just a lack of goodness.
- The biblical concept of evil is often depicted not as an original created substance,
  but as a parasitic corruption of what is good.
