trivia:
- Enoch lived 365 years - a year of years - and then was not, for God took him.
- Jude quotes a prophecy of Enoch, and the Ethiopian church still keeps the Book of
  Enoch as Scripture.
- Hebrews says Enoch was translated - carried across - the same Greek verb used for
  moving a body or a law.
