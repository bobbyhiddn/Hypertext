trivia:
- The Jordan River (Yarden) is named 'The Descender' because of its steep slope down
  to the Dead Sea.
- The theological term 'Kenosis' describes Christ's voluntary descent from divine
  glory to human humility.
- In scripture, going to Egypt is always described as 'going down' due to elevation
  and spiritual symbolism.
