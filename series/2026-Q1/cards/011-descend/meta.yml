weight_rationale: the LORD coming down is how the era's two great judgments open,
  at Babel and again over Sodom, and the same verb carries the descent from heaven
  in John - thematic vocabulary with real teaching, while the named events the era
  turns on are Babel and Sodom rather than the verb, so DESCEND stays at 3 and prints
  UNCOMMON
stats_rationale:
  lore: the printed verses have the LORD come down to see what the builders have made
    and the Son of man come down out of heaven - in this era a descent is God arriving
    to judge or to save, and both printed verses say so
  context: yarad occurs 380 times in the Hebrew Bible; katabaino occurs 81 times in
    the New Testament; total 461
  complexity: yarad reports direction rather than dignity, so the same verb takes
    a bucket down a well, a man down to Egypt and the LORD down to Babel, and Hebrew
    keeps using it for travel toward the coast or the south where English would never
    say down at all
