number: '011'
word: DESCEND
gloss: To move from a higher place to a lower one; to come down.
card_type: VERB
rarity: UNCOMMON
series: 2026-Q1
set: Babel
art_prompt: A brilliant white dove gliding downward through a vertical shaft of golden
  light that pierces through dark, heavy storm clouds to touch a mountain peak.
stats:
  lore: 4
  context: 3
  complexity: 2
ability: Look at the top 3 cards of the Tower. You may put any number of them on the
  bottom of the Tower.
ot_verse:
  ref: Genesis 28:12
  snippet: And behold, the angels of God were ascending and descending on it.
nt_verse:
  ref: Matthew 3:16
  snippet: He saw the Spirit of God descending like a dove and coming to rest on him.
greek:
  text: καταβαίνω
  translit: katabainō
hebrew:
  text: יָרַד
  translit: yarad
ot_refs: Gen 28:12 • Ex 19:18 • Ps 133:3 • Zech 14:4
nt_refs: Matt 3:16 • Eph 4:9 • 1 Thess 4:16 • Jas 1:17
trivia:
- The Hebrew root *yarad* is the origin of the name 'Jordan' (the Descender).
- Used to describe God's presence coming down to Mount Sinai in fire.
- Theologically linked to the Incarnation and Christ's descent to the dead.
