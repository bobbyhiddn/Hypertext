stats_rationale:
  lore: Genesis 1:2 - the Spirit of God brooding over the deep is the first act of the Spirit
    in Scripture and the seed of every doctrine of the Spirit's creative work; a doctrine
    hangs on this verse
  context: rachaph occurs 3 times in the Hebrew Bible; epiphero occurs 3 times in the New
    Testament; total 6
  complexity: rachaph is rare and its sense is disputed - brood, hover, or shake (Jer 23:9);
    Syriac and Ugaritic cognates mean to brood like a bird; the Septuagint rendered it epiphero,
    to bring upon, which the New Testament uses of God bringing wrath
ability: Choose one Page belonging to another player. Add up to five cards from Sheol to your
