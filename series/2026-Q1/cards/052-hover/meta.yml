stats_rationale:
  lore: this card's own verse is the second sentence of Scripture, where the Spirit
    moves over the deep before anything is made - a major theme close to doctrine
  context: rachaph occurs 3 times in the Hebrew Bible; epiphero occurs 5 times in
    the New Testament; total 8
