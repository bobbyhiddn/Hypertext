trivia:
- 'Rachaph appears three times in the Hebrew Bible and each one is a different picture:
  brooding, fluttering, shaking.'
- Deuteronomy 32:11 sets the verb over an eagle stirring her nest, which is why many
  read Genesis 1:2 as a bird brooding rather than a wind blowing.
- Jeremiah uses it of his own bones shaking at the word of the LORD - the same trembling
  suspension seen from inside.
