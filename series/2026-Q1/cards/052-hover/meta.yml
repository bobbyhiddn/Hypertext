trivia:
- Rachaph appears only three times; in Deuteronomy 32 it is the eagle fluttering over her
  young, so many read Genesis 1:2 as the Spirit brooding like a bird.
- The Septuagint rendered it epiphero, to bring upon, the same verb Paul uses of God bringing
  wrath - creation and judgment share one word.
- Before Babel's builders reached upward, the Spirit had already come down to hover over an
  empty deep.
