trivia:
- In Hebrew thought, being 'wise' (chakam) was often associated with practical skill
  and craftsmanship, not just intellect.
- Proverbs frequently contrasts the 'wise' person with the 'fool,' emphasizing moral
  choices and teachability over raw intelligence.
- Jesus advised His disciples to be 'wise as serpents and innocent as doves' when
  navigating a hostile world.
