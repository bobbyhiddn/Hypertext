trivia:
- The Hebrew 'chakam' originally referred to practical skill or craftsmanship, such
  as the artisans who built the Tabernacle.
- In the book of Proverbs, wisdom is frequently personified as a woman calling out
  in the public squares.
- Jesus contrasted the wise man who builds his foundation on solid rock with the foolish
  man who builds on sand.
