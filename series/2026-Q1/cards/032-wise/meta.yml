ot_verse:
  ref: Proverbs 13:20
  snippet: Whoever walks with the wise becomes wise, but the companion of fools will
    suffer harm.
nt_verse:
  ref: Matthew 7:24
  snippet: Everyone then who hears these words of mine and does them will be like
    a wise man who built his house on the rock.
greek:
  text: σοφός
  translit: sophos
hebrew:
  text: חָכָם
  translit: chakam
ot_refs: Prov 9:9 • Prov 13:20 • Eccl 8:1
nt_refs: Matt 7:24 • Rom 16:27 • Jas 3:13
trivia:
- The Hebrew word 'chakam' refers not just to intellectual knowledge, but to practical
  skill and moral discernment [1.16].
- In Matthew 7, Jesus compares those who hear and act on His teachings to a wise builder
  on solid rock.
- Wisdom literature, such as Proverbs and Ecclesiastes, repeatedly contrasts the wise
  person with the fool.
