  snippet: Look carefully then how you walk, not as unwise but as wise,
greek:
  text: σοφός
  translit: sophos
hebrew:
  text: חָכָם
  translit: chakam
ot_refs: Prov 1:5 • Prov 3:7 • Prov 9:9 • Ecc 8:1 • Isa 5:21
nt_refs: Matt 7:24 • Rom 1:22 • 1 Cor 3:18 • Eph 5:15 • Jas 3:13
trivia:
- The Hebrew word 'chakam' encompasses not just intellectual knowledge, but practical
  skill, artistry, and craftsmanship [1.2].
- In biblical literature, true wisdom is consistently rooted in 'the fear of the Lord'
  rather than human ingenuity.
- While the Greeks highly prized 'sophos', Paul contrasted worldly wisdom with the
  seemingly foolish wisdom of the cross.
