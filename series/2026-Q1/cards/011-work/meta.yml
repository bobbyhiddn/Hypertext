  complexity: 2
ability: Discard 1 card from your hand, then draw 2 cards.
ot_verse:
  ref: Psalm 90:17
  snippet: Establish the work of our hands upon us; yes, establish the work of our
    hands!
nt_verse:
  ref: Colossians 3:23
  snippet: Whatever you do, work heartily, as for the Lord and not for men.
greek:
  text: ἔργον
  translit: ergon
hebrew:
  text: מְלָאכָה
  translit: melakah
ot_refs: Gen 2:2 • Ex 20:9 • Ps 90:17 • Prov 16:3
nt_refs: John 6:29 • Eph 2:10 • Col 3:23 • James 2:17
trivia:
- The Hebrew 'melakah' refers to creative work, distinct from 'avodah' which implies
  servitude or worship.
- The Greek word 'ergon' is the etymological root of the English words 'energy' and
  'ergonomics'.
- In Genesis, work is introduced before the Fall, indicating it is originally a blessing,
  not a curse.
