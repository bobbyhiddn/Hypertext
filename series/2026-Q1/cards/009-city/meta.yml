weight_rationale: what Babel's builders set out to make and the first thing Cain builds
  after the curse - a settlement word with a clear place in the era, but the named
  event is Babel itself rather than the noun, so it stays at 2 and prints COMMON
stats_rationale:
  lore: the printed verses set the city the builders raised for their own name beside
    the city set on a hill that cannot be hid - a recognized theme of the era with
    clear teaching, though what is taught hangs on the builders' purpose rather than
    on the walls
  context: ir occurs 1093 times in the Hebrew Bible; polis occurs 162 times in the
    New Testament; total 1255
  complexity: ir covers everything from a walled capital to a hamlet - Cain builds
    one for a single household - while Greek polis carries a civic and political sense
    Hebrew never had, so the Septuagint quietly turns every Hebrew settlement into
    a city-state
