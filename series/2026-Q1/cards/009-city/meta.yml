trivia:
- The first city in Scripture is built by Cain, the man sentenced to be a fugitive
  and a vagabond, and he calls it after the name of his son.
- 'Genesis 11 names the city more often than the tower: the LORD comes down to see
  the city and the tower, and what the builders leave off building is the city.'
- Hebrews 11:10 answers Babel exactly - Abraham looked for a city which hath foundations,
  whose builder and maker is God.
