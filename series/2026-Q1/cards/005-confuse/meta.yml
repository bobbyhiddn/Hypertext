number: '005'
word: CONFUSE
gloss: To mix up, disorder, or baffle; to make indistinct or obscure.
card_type: VERB
rarity: RARE
series: 2026-Q1
set: Babel
art_prompt: A spiraling ancient stone tower dissolving into swirling chaotic mists
  and fragmented geometric shapes, ethereal light beams crossing in disorder, high
  contrast, surreal style
stats:
  lore: 5
  context: 4
  complexity: 3
ability: Target player shuffles their hand into the Tower, then draws that many cards.
ot_verse:
  ref: Genesis 11:7
  snippet: Come, let us go down and there confuse their language, so that they will
    not understand one another's speech.
nt_verse:
  ref: Acts 2:6
  snippet: The multitude came together, and were confounded, because that every man
    heard them speak in his own language.
greek:
  text: συγχεώ
  translit: sugcheō
hebrew:
  text: בָּלַל
  translit: balal
ot_refs: Gen 11:7 • Gen 11:9 • Deut 7:23 • Isa 19:3
nt_refs: Acts 2:6 • Acts 19:32 • 1 Cor 14:33 • Jas 3:16
trivia:
- From Latin 'confundere' meaning 'to pour together'.
- Hebrew 'balal' is a wordplay on 'Babel', linking the city to confusion.
- Pentecost (Acts 2) reverses the linguistic confusion of Babel.
