number: '005'
word: CONFUSE
gloss: To mix up, bewilder, or make unclear; to disrupt order or understanding.
card_type: VERB
rarity: RARE
series: 2026-Q1
set: Babel
art_prompt: A spiraling stone tower dissolving into swirling mist and chaotic geometric
  shapes, ancient architecture fragmenting into the sky, soft earth tones and dusty
  blues.
stats:
  lore: 5
  context: 3
  complexity: 3
ability: Target player shuffles their hand into the Tower, then draws that many cards.
ot_verse:
  ref: Genesis 11:7
  snippet: Come, let Us go down and there confuse their language, that they may not
    understand one another’s speech.
nt_verse:
  ref: Acts 19:32
  snippet: The assembly was confused, and most of them did not know why they had come
    together.
greek:
  text: συγχέω
  translit: sugcheō
hebrew:
  text: בָּלַל
  translit: balal
ot_refs: Gen 11:7 • Gen 11:9 • Ex 23:27 • Deut 7:23
nt_refs: Acts 2:6 • Acts 19:32 • 1 Cor 14:33 • Jas 3:16
trivia:
- The Hebrew word 'balal' sounds like 'Babel', creating a thematic wordplay.
- At Pentecost (Acts 2), the confusion of languages from Babel was supernaturally
  reversed.
- Paul contrasts confusion with peace in 1 Corinthians, stating God is not its author.
