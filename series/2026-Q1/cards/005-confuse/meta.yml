number: '005'
word: CONFUSE
gloss: To mix up, bewilder, or throw into disorder; to make unclear or indistinguishable.
card_type: VERB
rarity: RARE
series: 2026-Q1
set: Babel
art_prompt: A spiraling ancient stone tower dissolving into a chaotic mist of multicolored
  geometric shapes and shifting forms against a stark sky.
stats:
  lore: 5
  context: 3
  complexity: 3
ability: Swap your Lot with target player's Lot.
ot_verse:
  ref: Genesis 11:7
  snippet: Come, let Us go down and there confuse their language, that they may not
    understand one another's speech.
nt_verse:
  ref: Acts 2:6
  snippet: And when this sound occurred, the crowd came together, and were bewildered,
    because each one was hearing them speak in his own language.
greek:
  text: συγχέω
  translit: sygcheō
hebrew:
  text: בָּלַל
  translit: balal
ot_refs: Gen 11:7 • Gen 11:9 • Deut 28:20 • Isa 19:3
nt_refs: Acts 2:6 • Acts 9:22 • 1 Cor 14:33 • Jas 3:16
trivia:
- The Hebrew 'balal' sounds like 'Babel' and means to mix or mingle.
- God confused language at Babel to halt the prideful construction of the tower.
- The confusion of Babel was spiritually reversed by the Holy Spirit at Pentecost.
