number: '005'
word: CONFUSE
gloss: To mix up, bewilder, or throw into disorder; to scramble understanding.
card_type: VERB
rarity: RARE
series: 2026-Q1
set: Babel
art_prompt: A spiraling ancient stone tower dissolving into swirling, multicolored
  mists against a chaotic sky, abstract and disorienting.
stats:
  lore: 2
  context: 5
  complexity: 3
ability: Target player shuffles their hand into the Tower, then draws that many cards.
ot_verse:
  ref: Genesis 11:7
  snippet: Come, let Us go down and there confuse their language, that they may not
    understand one another’s speech.
nt_verse:
  ref: 1 Corinthians 14:33
  snippet: For God is not the author of confusion but of peace, as in all the churches
    of the saints.
greek:
  text: ἀκαταστασία
  translit: akatastasia
hebrew:
  text: בָּלַל
  translit: balal
ot_refs: Gen 11:7 • Gen 11:9 • Deut 28:28 • Isa 19:14
nt_refs: 1 Cor 14:33 • Acts 19:32 • Jas 3:16 • Acts 2:6
trivia:
- The Hebrew word 'balal' (to confuse) sounds like the name 'Babel'.
- In the NT, 'akatastasia' refers to disorder in worship rather than language.
- The confusion of Babel is spiritually reversed by the unity of Pentecost.
