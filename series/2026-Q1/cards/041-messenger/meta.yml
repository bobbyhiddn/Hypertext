trivia:
- Hebrew malakh and Greek angelos both mean simply messenger - angel names the office,
  not the species.
- Isaiah 52:7 blesses the very feet of the messenger who brings good tidings over
  the mountains.
- Proverbs likens a faithful messenger to snow-cold water in harvest - refreshing
  those who sent him.
