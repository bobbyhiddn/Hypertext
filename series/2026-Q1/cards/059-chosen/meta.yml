trivia:
- Bachir is the passive of bachar, to choose - the chosen one is the one picked out.
- Eklektos means picked out from among; the same word gives eclectic, a choice made
  from many.
- After Babel scattered the nations, God chose one man from Ur - election begins as
  a departure.
