weight: 3
weight_rationale: be fruitful and multiply is spoken at creation, again after the
  flood and again to Abram - thematic vocabulary with real teaching behind it; the
  promise itself is carried by COVENANT and SEED, so MULTIPLY stays at 3
stats_rationale:
  lore: the printed verses are the oath sworn to Abraham and the letter that quotes
    it back - the era's promise is stated in this verb
  context: rabah occurs 229 times in the Hebrew Bible; plethyno occurs 12 times in
    the New Testament; total 241
  complexity: Genesis 22:17 doubles the verb - harbah arbeh, in multiplying I will
    multiply - an infinitive absolute that Hebrews 6:14 keeps word for word in Greek,
    so the strangeness of the English is a deliberate carry-over
