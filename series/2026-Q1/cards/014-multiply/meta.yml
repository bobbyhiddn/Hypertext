trivia:
- The blessing to be fruitful and multiply is given to the fish and birds before it
  is ever given to man.
- After the flood the blessing is repeated to Noah twice in one chapter, as if the
  world were being started again.
- Hebrews 6:14 keeps the Hebrew doubling in Greek - blessing I will bless, multiplying
  I will multiply - rather than smoothing it into an adverb.
