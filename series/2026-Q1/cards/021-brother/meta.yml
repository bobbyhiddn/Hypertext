    to call us brethren - a recognized theme with clear teaching
  context: ach occurs 629 times in the Hebrew Bible; adelphos occurs 343 times in
    the New Testament; total 972
  complexity: ach stretches from a blood brother to a nephew, a neighbour and a whole
    nation - Lot is called Abram's brother though he is his brother's son - and adelphos
    inherits the stretch
