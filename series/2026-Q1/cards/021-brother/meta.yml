trivia:
- Adelphos is literally from one womb - a-delphys - which is why the New Testament
  has to stretch it to cover the church.
- Genesis 4 calls Abel his brother seven times in six verses; the word is repeated
  until the murder is unmistakably fratricide.
- Lot is Abram's nephew, yet Abram calls him brother - kinship in Genesis names the
  bond, not the exact degree.
