weight_rationale: the verb the whole Babel account is spoken in - go to, let us build
  - but it is an ordinary action word with a clear place in the era rather than a
  named agent or event; the named thing is the city and tower themselves, so BUILD
  stays at 2 and prints COMMON
stats_rationale:
  lore: the printed verses set the builders' let us build us a city and a tower beside
    a house built upon a rock - a recognized theme of the era with clear teaching,
    though the doctrine hangs on what is built rather than on the verb
  context: banah occurs 377 times in the Hebrew Bible; oikodomeo occurs 40 times in
    the New Testament; total 417
  complexity: banah and ben, to build and a son, are one root, so Sarai says I may
    be builded by her of a child, and Greek splits the sense with oikodomeo, to house-build,
    which the epistles then use for edifying people
