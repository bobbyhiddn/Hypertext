trivia:
- Genesis 11:5 says the LORD came down to see the city and the tower which the children
  of men builded - the builders reach for heaven and heaven has to stoop to look.
- Hebrew builds a son and a house with the same root, which is why a barren wife in
  Genesis asks to be builded by her handmaid.
- The first thing built after the flood is not a city but an altar; Noah builds it
  before the ground has dried.
