trivia:
- Genesis 1 never names the sun and moon; they are the greater light and the lesser
  light, gadol and qaton.
- Babel's builders wanted to make a name; God tells Abram he will make his name great
  - the same wish granted by gift instead of by brick.
- Nineveh is called that great city three times in Jonah; its founder Nimrod was the
  mighty hunter of Genesis 10.
