trivia:
- The Hebrew root 'barak' is related to the word for 'knee,' implying kneeling to
  offer or receive favor.
- The 'Priestly Blessing' in Numbers 6 is one of the oldest known biblical texts,
  found on silver scrolls from 600 BC.
- The Greek word 'eulogeo' (to speak well of) is the origin of the English word 'eulogy.'
