trivia:
- Eden may mean delight - or echo the Sumerian edin, the open plain - the same plain
  where Babel would rise.
- The Septuagint called the garden paradeisos, a Persian word for a walled royal park;
  paradise is Eden in Greek dress.
- The New Testament never names Eden, yet promises the tree of life in the paradise
  of God.
