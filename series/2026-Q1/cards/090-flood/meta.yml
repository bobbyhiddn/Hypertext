stats_rationale:
  lore: the flood is the era's judgment and the New Testament's own picture of the
    day of the Lord and of baptism - a doctrine hangs on the word
  context: mabbul occurs 13 times in the Hebrew Bible; kataklysmos occurs 4 times
    in the New Testament; total 17
  complexity: mabbul is reserved for this one event and for the LORD sitting upon
    the flood in Psalm 29, so its derivation is argued from yabal to flow, from nabal
    to fall, and from an Akkadian loan; kataklysmos, the word the Greek translators
    chose, gives English cataclysm
weight: 5
weight_rationale: the pillar the whole era turns on - the judgment the ark, the dove,
  the covenant and the rainbow all hang from; the chase card of the set
ability: Each player puts every card from that player's hand into Sheol. Then each
  player draws one card from the Tower and you draw four cards from the Tower.
