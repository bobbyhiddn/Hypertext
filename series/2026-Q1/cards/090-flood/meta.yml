ot_refs: Gen 6:17 • Gen 7:17 • Gen 9:11 • Ps 29:10
nt_refs: Matt 24:38 • Matt 24:39 • Luke 17:27 • 2 Pet 2:5
trivia:
- 'Hebrew keeps a separate word for this water: mabbul is never used of an ordinary
  river in flood.'
- Psalm 29:10 is the one place outside Genesis that uses it - the LORD sitteth upon
  the flood, still enthroned over it.
- 'Peter reads the flood as a figure of baptism: the same water that destroys the
  world carries the ark.'
