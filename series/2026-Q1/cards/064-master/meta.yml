trivia:
- Baal simply meant owner or master before it named the storm god; Hosea says Israel
  will call God ishi, my husband, and no more baali, my master.
- Despotes, the master of a household, is also the word Simeon uses to address God
  - Lord, now lettest thou thy servant depart.
- The tower's masters had bricks for stone and slime for mortar; the text names the
  work before it names a single worker.
