weight_rationale: Nimrod the mighty hunter is the era's first strong man and the founder
  of Babel's cities, but the card word is the trade, not the man - thematic vocabulary
  with real teaching behind it rather than a named agent
stats_rationale:
  lore: the hunter before the LORD begins the kingdom that raises Babel, and the New
    Testament verse turns the hunt into judgment - a recognized theme with clear teaching,
    not a doctrine
  context: tsayad, the hunter, occurs 2 times in the Hebrew Bible and tsayid, the
    hunt and its game, 19 times; thera occurs 1 time in the New Testament; total 22
  complexity: tsayad the hunter and tsayid the hunt are read into one another, and
    before the LORD in Genesis 10:9 is taken either as with God's favour or in defiance
    of him - a contested phrase
