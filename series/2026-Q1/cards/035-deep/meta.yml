trivia:
- 'Hebrew keeps two depths apart: amoq for a well or a thought, tehom for the deep
  that covered the earth.'
- Jacob's well at Sychar, the one the woman calls deep, is still over thirty metres
  to the water.
- Luke calls the dawn of the resurrection deep morning, using the same adjective as
  the well.
