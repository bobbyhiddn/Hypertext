stats_rationale:
  lore: in this card's verses depth is what a wise man draws out and what a well withholds
    - a recognized theme with clear teaching, not a doctrine the word carries
  context: amoq occurs 17 times in the Hebrew Bible; bathys occurs 4 times in the
    New Testament; total 21
  complexity: amoq is used of counsel, of thought, of a wound and of a well, never
    of the sea, which Hebrew calls tehom; bathys stretches from a deep well to deep
    morning in Luke 24:1 - a range that needs a note
weight: 3
weight_rationale: amoq is the era's word for what lies below sounding - counsel, thought,
  a well - thematic vocabulary with real teaching, but the deep of Genesis 1:2 is
  tehom and belongs to another card
