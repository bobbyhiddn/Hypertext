trivia:
- In Hebrew, 'rasha' often carries a legal sense of being guilty or in the wrong,
  not just morally bad.
- The Book of Proverbs frequently uses poetic parallelism to directly contrast the
  'wicked' with the 'righteous'.
- The Greek word 'ponēros' implies an active, corrupting, and harmful evil, rather
  than a mere lack of goodness.
