trivia:
- In Hebrew, 'rasha' implies being guilty of a crime or morally wrong, frequently
  contrasted with the righteous ('tzadik').
- The Greek 'ponēros' emphasizes an active, harmful, and corrupting evil, rather than
  just a passive lack of goodness.
- Biblical wisdom literature frequently employs the 'two ways' motif, starkly contrasting
  the destructive path of the wicked with the life-giving path of the just.
