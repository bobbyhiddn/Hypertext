trivia:
- In Hebrew, 'rasha' fundamentally implies being guilty of a crime or being actively
  hostile to God's order.
- The Greek 'ponēros' describes an active, harmful evil that seeks to corrupt others,
  rather than just passive badness.
- The Psalms frequently contrast the 'wicked' with the 'righteous' to highlight two
  divergent paths of life and their ultimate destinations.
