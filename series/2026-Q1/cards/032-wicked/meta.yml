trivia:
- The Hebrew word 'rasha' implies being guilty of a crime or morally wrong, and is
  frequently contrasted with the righteous.
- In Greek, 'ponēros' denotes active, harmful evil and malice, not just passive badness
  or poor quality.
- The Psalms frequently use the imagery of chaff driven by the wind to describe the
  ultimate, fleeting fate of the wicked.
