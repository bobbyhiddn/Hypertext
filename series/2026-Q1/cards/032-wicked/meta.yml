trivia:
- In Hebrew, 'rasha' describes one guilty of a crime, hostile to God, or living in
  defiance of His character.
- The Greek 'ponēros' emphasizes the active, destructive, and harmful nature of evil,
  not just its presence.
- The Psalms frequently contrast the wicked, who are like unstable chaff, with the
  righteous, who are like deeply rooted trees.
