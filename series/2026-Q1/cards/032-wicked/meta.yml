trivia:
- The Hebrew word 'rasha' often carries a legal sense of being guilty or condemned
  before a judge.
- In Greek, 'ponēros' emphasizes the active, destructive nature of evil, whereas 'kakos'
  often refers to intrinsic worthlessness.
- Wisdom literature frequently contrasts the wicked with the righteous to highlight
  their fundamentally different paths and ends.
