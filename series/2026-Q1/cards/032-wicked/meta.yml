trivia:
- The Greek word 'ponēros' originally meant 'oppressed by toils' before evolving to
  mean 'worthless' or 'wicked.'
- In Hebrew, 'rasha' often describes not just an evil person, but one who is actively
  hostile to God and His people.
- The Book of Proverbs frequently contrasts the 'wicked' (rasha) with the 'righteous'
  (tsaddiq) to illustrate the two paths of life.
