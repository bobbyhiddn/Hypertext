trivia:
- The Hebrew word 'rasha' conveys the idea of being guilty or morally wrong, and is
  frequently contrasted with the righteous.
- In Psalm 1, the wicked are vividly compared to chaff, the useless husk of grain
  that is easily blown away by the wind.
- The Greek word 'poneros' describes an active, malignant form of evil that causes
  labor, pain, and sorrow, rather than just general badness.
