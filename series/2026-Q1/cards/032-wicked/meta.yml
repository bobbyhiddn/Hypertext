trivia:
- In Hebrew, rasha fundamentally describes someone guilty of a crime or actively hostile
  to God, directly opposing the righteous (tzaddik).
- The Greek ponēros emphasizes an active, malignant form of evil that causes pain,
  labor, and destruction, unlike mere badness.
- In both Testaments, the wicked are frequently contrasted with the righteous using
  agricultural metaphors, such as chaff blown by the wind or weeds among wheat.
