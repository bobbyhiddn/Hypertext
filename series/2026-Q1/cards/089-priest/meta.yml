trivia:
- Melchizedek is the first priest named in Scripture, and he appears centuries before
  there is a priesthood.
- Abram gives him tithes of all - the tithe is older than the law that commands it.
- 'Hebrews argues from the silence of Genesis: no father, no mother, no beginning
  of days recorded, therefore a priest for ever.'
