trivia:
- Mashchit is a participle - the one ruining - and the same word names the pit of
  corruption in Psalm 55.
- Paul's olothreutes in 1 Corinthians 10 is a New Testament hapax, echoing the Septuagint's
  word for the Passover destroyer.
- Revelation gives the office a name in two tongues, Abaddon and Apollyon - the Destroyer.
