stats_rationale:
  lore: the Passover destroyer and the plague of 1 Corinthians 10 carry the theme
    of judgment passing over the marked; a recognized theme rather than a doctrine
  context: mashchit occurs 19 times in the Hebrew Bible; olothreutes occurs 1 time
    in the New Testament (1 Cor 10:10); total 20
  complexity: mashchit is the Hiphil participle of shachath, to ruin or corrupt, and
    also means the pit; the Septuagint's olethreuon in Exodus 12 becomes Paul's olothreutes,
    a New Testament hapax, and Revelation names the same office Apollyon
