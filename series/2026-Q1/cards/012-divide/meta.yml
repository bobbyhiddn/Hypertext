number: '012'
word: DIVIDE
gloss: To separate into parts; to distinguish, partition, or distribute shares.
card_type: VERB
rarity: UNCOMMON
series: 2026-Q1
set: Babel
art_prompt: A stark, abstract composition showing a vertical rift of pure white light
  splitting a chaotic, dark, swirling mass into two distinct, ordered halves. High
  contrast, geometric style.
stats:
  lore: 4
  context: 5
  complexity: 2
ability: Reveal the top 3 cards of the Tower. Put 1 into your hand, 1 into Sheol,
  and 1 on the bottom of the Tower.
ot_verse:
  ref: Genesis 1:4
  snippet: 'And God saw the light, that it was good: and God divided the light from
    the darkness.'
nt_verse:
  ref: Hebrews 4:12
  snippet: Piercing even to the dividing asunder of soul and spirit, and of the joints
    and marrow.
greek:
  text: μερισμός
  translit: merismos
hebrew:
  text: בָּדַל
  translit: badal
ot_refs: Gen 1:7 • Ex 14:21 • Ps 78:13 • Dan 5:28
nt_refs: Luke 12:13 • 1 Cor 1:13 • 2 Tim 2:15 • Matt 25:32
trivia:
- The Hebrew 'badal' appears five times in Genesis 1 to describe God separating distinct
  elements.
- Hebrews 4:12 claims the Word of God is sharp enough to divide the immaterial soul
  and spirit.
- In 2 Timothy 2:15, 'rightly dividing' translates 'orthotomeō', literally meaning
  'to cut a straight path'.
