trivia:
- The Greek word 'gymnos' is the root of 'gymnasium,' as ancient athletes trained
  and competed without clothing.
- In biblical context, being 'naked' often meant wearing only a tunic without an outer
  cloak, rather than total nudity.
- The prophet Isaiah walked 'naked and barefoot' for three years as a dramatic sign
  of Egypt's impending captivity.
