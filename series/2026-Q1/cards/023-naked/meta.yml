trivia:
- Hebrew 'arowm derives from a root meaning 'to be exposed' or 'bare'.
- Biblical nakedness often symbolizes vulnerability, guilt, or a lack of spiritual
  covering.
- In John 21, Peter was 'naked' (gymnos) meaning he had stripped for work, not fully
  nude.
