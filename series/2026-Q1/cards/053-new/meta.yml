trivia:
- 'Greek has two words for new: neos means recent, kainos means unprecedented in kind; the
  new tongues and the new covenant are kainos.'
- Babel confused one tongue into many; at Pentecost many tongues carried one message - a new
  thing, not a repaired old one.
- Chadash also names the new moon, chodesh - the month begins when the light is made new.
