trivia:
- The same word carries Moses down the Nile in a basket of bulrushes daubed with pitch
  - two rescues by water in one vocabulary.
- The ark has no rudder, no sail and no oars; it is described as a floating chest,
  and the LORD shuts the door.
- Greek uses kibotos for Noah's ark and for the ark of the covenant alike; Hebrew
  keeps them apart as tebah and aron.
