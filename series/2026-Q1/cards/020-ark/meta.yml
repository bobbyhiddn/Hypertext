weight_rationale: the named thing the era turns on - the judgment of the whole earth
  is survived inside it, and Hebrews makes it the pattern of salvation by faith; a
  weight-4 word, which is why it prints RARE
stats_rationale:
  lore: the printed verses are the command to build and the verdict that by it Noah
    condemned the world and became heir of righteousness - salvation through judgment
    is stated on this object
  context: tebah occurs 28 times in the Hebrew Bible; kibotos occurs 6 times in the
    New Testament; total 34
  complexity: tebah is used of only two things in all of Scripture, Noah's vessel
    and the basket of bulrushes that carries Moses, and it is never the ark of the
    covenant, which is aron - a distinction Greek loses by calling all of them kibotos
