number: '011'
word: SEED
gloss: The grain from which a plant grows; figuratively, offspring, descendants, or
  the Word of God.
card_type: NOUN
rarity: COMMON
series: 2026-Q1
set: Babel
art_prompt: A single golden grain of wheat resting in a furrow of dark, rich soil,
  with a faint golden light emanating from within the shell, cinematic lighting, macro
  photography style.
stats:
  lore: 4
  context: 5
  complexity: 2
ability: Place a card from your hand on the bottom of the Tower to draw 2 cards.
ot_verse:
  ref: Genesis 3:15
  snippet: I will put enmity between thee and the woman, and between thy seed and
    her seed; it shall bruise thy head.
nt_verse:
  ref: Luke 8:11
  snippet: 'Now the parable is this: The seed is the word of God.'
greek:
  text: σπέρμα
  translit: Sperma
hebrew:
  text: זֶרַע
  translit: Zera
ot_refs: Gen 12:7 • Jer 31:27 • Ps 126:6 • Gen 8:22
nt_refs: Gal 3:16 • 1 Pet 1:23 • Matt 13:31 • Mark 4:31
trivia:
- Genesis 3:15 is known as the Protoevangelium, the first promise of the Messiah as
  the 'Seed of the woman'.
- The Hebrew 'zera' and Greek 'sperma' are used interchangeably for agricultural grain
  and human descendants.
- In Galatians 3, Paul argues that the Abrahamic promise was made to one 'Seed' (singular),
  referring to Christ.
