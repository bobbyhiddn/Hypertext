trivia:
- Haphak means to turn over - the same verb overturns Sodom in Genesis 19 and, in
  Jonah, threatens Nineveh with being overturned, a city that turned instead.
- Katastrepho, to overturn, is the verb of the tables in the temple; its noun katastrophe
  passed into English unchanged.
- Babel was not overthrown by fire but by confusion - the tower was simply left, the
  first ruin abandoned rather than destroyed.
