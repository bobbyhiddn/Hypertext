ability: Shuffle Sheol into the Tower. Then, draw 7 cards.
ot_verse:
  ref: Genesis 1:1
  snippet: In the beginning God created the heaven and the earth.
nt_verse:
  ref: John 1:1
  snippet: In the beginning was the Word, and the Word was with God, and the Word
