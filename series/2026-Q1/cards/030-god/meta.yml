number: '030'
word: GOD
gloss: The supreme being, creator, and ruler of the universe; the eternal, infinite,
  and unchangeable Spirit.
card_type: TITLE
rarity: GLORIOUS
series: 2026-Q1
set: Babel
art_prompt: A blinding, radiant singularity of pure white and gold light exploding
  outward into a deep void, forming geometric constellations and nebulae. Ethereal,
  abstract, majestic, non-figurative, cinematic lighting, divine atmosphere.
