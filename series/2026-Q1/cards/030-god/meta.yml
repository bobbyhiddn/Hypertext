hebrew:
  text: אֱלֹהִים
  translit: Elohim
ot_refs: Gen 1:1 • Ex 3:14 • Deut 6:4 • Isa 45:5
nt_refs: John 1:1 • Acts 17:24 • Rom 1:20 • Rev 21:6
trivia:
- Hebrew 'Elohim' uses a plural ending with singular verbs, often called the 'plural
  of majesty'.
- The Tetragrammaton YHWH appears over 6,800 times in the OT but was considered too
  holy to pronounce.
- Greek 'Theos' was repurposed from polytheistic vocabulary to exclusively denote
  the one true Creator.
