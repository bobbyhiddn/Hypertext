trivia:
- '"Elohim" is grammatically plural but takes singular verbs, emphasizing majesty
  over multiplicity.'
- The Bible gives no physical description of God, only describing His glory, light,
  and throne.
- NT writers repurposed the Greek "Theos"—used for pagan deities—to describe the One
  True God.
