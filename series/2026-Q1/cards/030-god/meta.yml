greek:
  text: Θεός
  translit: Theos
hebrew:
  text: אֱלֹהִים
  translit: Elohim
ot_refs: Gen 1:1 • Ex 3:14 • Deut 6:4 • Ps 46:1 • Isa 40:28
nt_refs: John 1:1 • Rom 1:20 • 1 Cor 8:6 • Heb 11:6 • Rev 21:3
trivia:
- Hebrew 'Elohim' is grammatically plural but takes singular verbs, implying majesty
  or tri-unity.
- Greek 'Theos' was a common term for pagan deities before being redefined by NT writers.
- In the KJV, 'GOD' (all caps) translates YHWH only when preceded by 'Lord' (Adonai).
