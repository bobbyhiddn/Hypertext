trivia:
- The Hebrew 'Elohim' is grammatically plural, often interpreted as a 'plural of majesty'
  or hinting at the Trinity.
- Scripture uses anthropomorphic terms like 'hand' or 'eye' for God, yet defines Him
  as an invisible, immortal Spirit.
- The divine name YHWH appears over 6,000 times but was considered too holy to speak,
  often replaced by 'Adonai'.
