trivia:
- The Hebrew 'Elohim' is plural in form but takes singular verbs, emphasizing majesty
  and unity.
- The Greek 'Theos' was repurposed by New Testament writers to distinguish the One
  True God from pagan deities.
- This title implies the attributes of omniscience (all-knowing), omnipotence (all-powerful),
  and omnipresence (everywhere).
