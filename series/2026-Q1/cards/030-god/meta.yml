trivia:
- The Hebrew 'Elohim' is grammatically plural, often interpreted as denoting absolute
  majesty or the Trinity.
- The personal name YHWH was considered too holy to pronounce, so readers substituted
  'Adonai' (Lord).
- Jesus introduced the intimate Aramaic term 'Abba' (Father) for God, marking a shift
  in relational theology.
