trivia:
- Elohim is a plural noun governing singular verbs, suggesting supreme majesty rather
  than numerical plurality.
- The Greek Theos bridges Hebrew monotheism with the philosophical concept of the
  Ultimate Reality.
- While Elohim refers to the Creator's power, the name Yahweh (LORD) signifies His
  covenant relationship.
