trivia:
- The Hebrew 'Elohim' is grammatically plural but takes a singular verb when referring
  to the Creator.
- The Greek 'Theos' was used by the Septuagint to translate both 'Elohim' and the
  divine name 'Yahweh'.
- This word appears in the first verse of the Bible as the subject of the act of creation.
