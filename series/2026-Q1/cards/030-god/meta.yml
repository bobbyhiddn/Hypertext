number: '030'
word: GOD
gloss: The Supreme Being, Creator, and Ruler of the universe; the eternal and infinite
  One who is the source of all existence.
card_type: TITLE
rarity: GLORIOUS
series: 2026-Q1
set: Babel
art_prompt: A blinding, radiant singularity of white and gold light amidst deep cosmic
  darkness, forming a vague geometric order or burning bush motif, ethereal and formless,
  creating a sense of infinite scale and power.
