trivia:
- The Hebrew 'Elohim' is grammatically plural but takes singular verbs when referring
  to the one true God.
- Greek 'Theos' was a common term for pagan deities before being redefined by New
  Testament writers.
- This title appears over 4,000 times in the Bible, distinct from the personal name
  'Yahweh'.
