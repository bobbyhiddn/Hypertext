trivia:
- Genesis uses the same reflexive form for God walking in the garden in the cool of
  the day and for Enoch walking with God.
- Noah walked with God; Abram is told to walk before God - the prepositions mark two
  different callings.
- Paul's peripateo, to walk around, became the standard New Testament word for how
  a believer lives.
