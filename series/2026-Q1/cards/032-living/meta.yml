trivia:
- In Hebrew, 'living water' (mayim chayim) refers to flowing, fresh water from a spring
  or river, as opposed to stagnant cistern water.
- The Greek participle 'zōn' emphasizes a continuous, active state of vitality rather
  than just biological existence.
- New Testament writers frequently use 'living' to describe spiritual realities, such
  as stones, sacrifices, and hope.
