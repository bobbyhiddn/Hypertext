trivia:
- Babel means gate of god in Akkadian; Genesis hears it instead as balal, confusion,
  and the pun is the whole verdict on the city.
- The same verb mixes oil into the fine flour of a meal offering - in Hebrew, confusion
  and a careful blending are one word.
- 'Acts 2 reverses the sentence without undoing it: the tongues stay many, and the
  hearing is what is healed.'
