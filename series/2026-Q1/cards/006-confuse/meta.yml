weight: 4
weight_rationale: the named judgment the era ends in - the confounding of one lip
  into many is the act that makes the nations and gives Babel its name; a weight-4
  word, which is why it prints RARE
stats_rationale:
  lore: the printed verses are the confounding of the one language and the crowd at
    Pentecost confounded because every man heard his own tongue - in this era the
    state of human speech is decided by this verb
  context: balal occurs 44 times in the Hebrew Bible; sygcheo occurs 5 times in the
    New Testament; total 49
  complexity: balal ordinarily means to mingle oil into flour for an offering, so
    the word for a grain offering and the word for Babel's judgment are the same;
    Genesis then puns Babel on it, and Greek answers with sygcheo, to pour together,
    a word for liquids and for riots alike
