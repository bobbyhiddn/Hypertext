trivia:
- The Hebrew 'Av' is likely mimetic of infant babbling, similar to 'Papa' in English.
- In the ancient Near East, the 'bet av' (house of the father) was the primary social
  and legal unit.
- Jesus used the intimate Aramaic term 'Abba' in prayer, revolutionizing the believer's
  access to God.
