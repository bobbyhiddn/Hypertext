trivia:
- The Aramaic term 'Abba' expresses deep intimacy, similar to 'Daddy' or 'Papa.'
- God is called 'Father' over 165 times in the Gospels, but only rarely in the Old
  Testament.
- In ancient Hebrew culture, the father was the head of the 'bet ab' and responsible
  for spiritual instruction.
