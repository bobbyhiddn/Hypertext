trivia:
- The Aramaic word 'Abba' expresses deep intimacy, akin to 'Daddy' or 'Papa'.
- God is referred to as Father only 15 times in the OT, but over 165 times in the
  NT.
- In ancient Roman law, the 'paterfamilias' held absolute authority over the household.
