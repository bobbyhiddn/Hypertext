trivia:
- The Hebrew word 'Av' is built from the first two letters of the alphabet, signifying
  primacy.
- Jesus used the Aramaic term 'Abba' (Daddy), introducing a radical intimacy with
  God.
- In biblical culture, a father was the religious instructor and legal authority of
  the home.
