trivia:
- 'Cain answers a question about his brother with a word from the garden: the man
  was put there to dress it and to keep it.'
- Psalm 121 uses the keeper word six times in eight verses - he that keepeth thee
  will not slumber.
- Phylax is the guard at a door; its cousin phylake is the cell behind that door,
  which is why the same root is translated both watch and prison.
