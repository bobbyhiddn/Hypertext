weight_rationale: Cain's question and the keeping of the garden give the era its word
  for responsibility - thematic vocabulary with real teaching; it names a role rather
  than a person the era turns on, so it stays at 3
stats_rationale:
  lore: the printed verses give Cain's refusal of the charge and the LORD taken as
    the keeper of his own - a recognized theme with clear teaching, though the doctrine
    hangs on the keeping rather than the title
  context: shomer is the participle of shamar, which occurs 468 times in the Hebrew
    Bible; phylax occurs 3 times in the New Testament; total 471
  complexity: shamar means to guard, to tend and to observe at once, so the keeper
    of a garden, the keeper of a flock and the keeper of a commandment are one word;
    phylax gives phylake, which is both a watch of the night and a prison
