weight_rationale: the refrain of the creation week and the name of the forbidden tree
  - a descriptive word with a clear place in the era, not a named agent or event,
  so it stays at 2 and prints COMMON
stats_rationale:
  lore: the printed verses are the verdict on the whole creation and the verdict that
    none is good but God - the era's judgment of worth rests on this word
  context: tov occurs 559 times in the Hebrew Bible; agathos occurs 102 times in the
    New Testament; total 661
  complexity: tov covers good, pleasant, fit and beautiful in one adjective, and the
    tree of the knowledge of good and evil pairs it with ra - a range a translator
    must choose within
