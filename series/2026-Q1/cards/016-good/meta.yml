trivia:
- Six days are called good; only the sixth is called very good, and only one thing
  in Eden is called not good - that the man should be alone.
- The tree of the knowledge of good and evil sets tov against ra, the only pairing
  in Genesis where knowing is forbidden.
- 'Greek splits the word Hebrew keeps whole: agathos is good in worth, kalos good
  to look at, and the Septuagint chooses between them verse by verse.'
