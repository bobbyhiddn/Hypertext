trivia:
- The first thing the man and the woman do after eating is hear - the sound of God
  walking in the garden sends them into the trees.
- Hebrew has no separate verb for obey; to hear a command and to keep it are the same
  word, which is why the KJV writes hearken.
- The Shema takes its name from its first word, shema - Hear, O Israel.
