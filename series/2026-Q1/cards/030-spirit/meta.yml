trivia:
- The Hebrew 'ruach' and Greek 'pneuma' both mean wind, breath, and spirit.
- The 'fruit of the Spirit' is a singular noun representing nine attributes like love
  and joy.
- In the Old Testament, the Spirit often 'rushed' upon leaders to empower them for
  specific tasks.
