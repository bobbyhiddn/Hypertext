trivia:
- Both Hebrew 'ruach' and Greek 'pneuma' can mean 'wind,' 'breath,' or 'spirit' depending
  on context.
- In the Old Testament, the Spirit often empowered individuals for specific tasks;
  in the New, He indwells believers.
- The Spirit is described as a 'deposit' or 'seal' guaranteeing the believer's future
  inheritance.
