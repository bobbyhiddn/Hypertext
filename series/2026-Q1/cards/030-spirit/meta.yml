number: '030'
word: SPIRIT
gloss: The non-physical part of a person; the Holy Spirit of God; wind; breath; life-force.
card_type: TITLE
rarity: GLORIOUS
series: 2026-Q1
set: Babel
art_prompt: Abstract ethereal wind made of swirling golden light and fire descending
  over dark waters, forming a vague dove-like shape in the mist, divine breath, glowing
  atmosphere, dynamic motion, no text.
stats:
  lore: 5
  context: 5
  complexity: 4
ability: Target player shuffles their hand into the Tower, then draws 7 cards.
ot_verse:
  ref: Zechariah 4:6
  snippet: Not by might, nor by power, but by my Spirit, says the LORD of hosts.
nt_verse:
  ref: 2 Corinthians 3:17
  snippet: Now the Lord is the Spirit, and where the Spirit of the Lord is, there
    is freedom.
greek:
  text: πνεῦμα
  translit: pneuma
hebrew:
  text: רוּחַ
  translit: ruach
ot_refs: Gen 1:2 • Ex 31:3 • Num 11:25 • Ez 37:14
nt_refs: Mt 3:16 • Jn 3:8 • Acts 2:4 • Rom 8:26
trivia:
- Hebrew 'ruach' is feminine and Greek 'pneuma' is neuter; both also mean 'wind' or
  'breath'.
- In the OT, the Spirit empowered leaders temporarily; in the NT, He indwells believers
  permanently.
- Jesus compared the Spirit to the wind, which blows where it wishes and cannot be
  predicted.
