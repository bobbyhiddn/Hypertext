number: '030'
word: SPIRIT
gloss: The animating force of God; breath, wind, or the Holy Spirit.
card_type: TITLE
rarity: GLORIOUS
series: 2026-Q1
set: Babel
art_prompt: A radiant, translucent dove form made of swirling wind and fire, descending
  from a break in dark storm clouds, illuminating the waters below.
stats:
  lore: 5
  context: 5
  complexity: 5
ability: Return a card from Sheol to your hand, then draw 2 cards.
ot_verse:
  ref: Zechariah 4:6
  snippet: Not by might, nor by power, but by my spirit, saith the LORD of hosts.
nt_verse:
  ref: John 3:8
  snippet: The wind bloweth where it listeth... so is every one that is born of the
    Spirit.
greek:
  text: Πνεῦμα
  translit: Pneuma
hebrew:
  text: רוּחַ
  translit: Ruach
ot_refs: Gen 1:2 • Zech 4:6 • Isa 61:1 • Joel 2:28
nt_refs: Matt 3:16 • John 3:8 • Acts 2:4 • Gal 5:22
trivia:
- The Hebrew word 'ruach' and Greek 'pneuma' both mean 'wind,' 'breath,' or 'spirit.'
- In Genesis 1:2, the Spirit 'hovers' over the waters, a verb used for a mother bird.
- The 'fruit of the Spirit' (Galatians 5) lists nine attributes including love and
  peace.
