stats_rationale:
  lore: the printed verses make the Spirit the maker of a man and the giver of life
    against the letter that kills - a doctrine hangs on the word
  context: ruach occurs 378 times in the Hebrew Bible; pneuma occurs 379 times in
    the New Testament; total 757
  complexity: one word carries wind, breath and spirit in both languages, so every
    occurrence is a translator's decision - and John 3:8 plays on all three at once,
    a pun no English rendering can keep
