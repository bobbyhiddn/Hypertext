number: '030'
word: SPIRIT
gloss: The non-physical part of a person; the Holy Spirit of God; breath, wind, or
  life force.
card_type: TITLE
rarity: GLORIOUS
series: 2026-Q1
set: Babel
art_prompt: Ethereal swirling currents of wind and flame, glowing dove silhouette
  formed by negative space in the light, dynamic motion over dark waters, golden and
  white particles, mystical atmosphere, no text.
