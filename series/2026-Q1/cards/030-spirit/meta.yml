trivia:
- Hebrew 'ruach' (feminine) and Greek 'pneuma' (neuter) both mean 'wind', 'breath',
  or 'spirit'.
- The Spirit appears in the second verse of the Bible (Gen 1:2) and the final invitation
  (Rev 22:17).
- In the OT, the Spirit often 'rushed upon' leaders for specific tasks; in the NT,
  the Spirit indwells believers.
