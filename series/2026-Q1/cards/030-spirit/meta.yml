number: '030'
word: SPIRIT
gloss: The animating force of life; the third person of the Trinity; the breath of
  God.
card_type: TITLE
rarity: GLORIOUS
series: 2026-Q1
set: Babel
art_prompt: Abstract and ethereal composition; swirling currents of golden wind and
  tongues of fire coalescing into a dove-like luminance against deep azure shadows;
  dynamic, radiant, and non-figurative.
stats:
  lore: 5
  context: 5
  complexity: 4
ability: Draw 1 card for each different card type currently in your Pages.
ot_verse:
  ref: Zechariah 4:6
  snippet: Not by might, nor by power, but by my spirit, saith the LORD of hosts.
nt_verse:
  ref: 2 Corinthians 3:17
  snippet: 'Now the Lord is that Spirit: and where the Spirit of the Lord is, there
    is liberty.'
greek:
  text: πνεῦμα
  translit: Pneuma
hebrew:
  text: רוּחַ
  translit: Ruach
ot_refs: Gen 1:2 • Num 11:25 • Isa 11:2 • Ezek 37:14 • Joel 2:28
nt_refs: Matt 3:16 • John 3:5 • Acts 2:4 • Rom 8:14 • Gal 5:22
trivia:
- The Hebrew 'ruach' and Greek 'pneuma' both translate to 'wind,' 'breath,' and 'spirit.'
- Scripture uses symbols like a dove, fire, oil, and wind to describe the Spirit's
  invisible work.
- The Spirit is the agent of creation in Genesis and the agent of new creation in
  the Gospels.
