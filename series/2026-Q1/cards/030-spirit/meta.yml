  lore: 5
  context: 5
  complexity: 5
ability: Return up to 3 cards from Sheol to your hand.
ot_verse:
  ref: Zechariah 4:6
  snippet: Not by might nor by power, but by my Spirit,' says the LORD Almighty.
nt_verse:
  ref: John 3:8
  snippet: The wind blows where it wishes... So it is with everyone born of the Spirit.
greek:
  text: Πνεῦμα
  translit: Pneuma
hebrew:
  text: רוּחַ
  translit: Ruach
ot_refs: Gen 1:2 • Ex 31:3 • Ps 51:11 • Isa 61:1 • Joel 2:28
nt_refs: Matt 3:16 • John 14:26 • Acts 2:4 • Rom 8:26 • Gal 5:22
trivia:
- Both 'Ruach' (Hebrew) and 'Pneuma' (Greek) mean wind, breath, and spirit.
- The Spirit appears in the second verse of Genesis and the final chapter of Revelation.
- Represents the empowering presence of God, often symbolized by wind, fire, or a
  dove.
