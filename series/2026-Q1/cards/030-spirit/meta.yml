trivia:
- Genesis 8:1 uses the same word for the wind God makes pass over the earth to dry
  the flood - wind and Spirit are one word.
- 'Genesis 6:3 sets the era''s clock: my spirit shall not always strive with man,
  yet his days shall be an hundred and twenty years.'
- John 3:8 turns on the double sense - the wind bloweth where it listeth, and so is
  every one that is born of the Spirit.
