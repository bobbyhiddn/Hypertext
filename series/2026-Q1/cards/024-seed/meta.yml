trivia:
- The Hebrew 'zera' is a collective noun, used for both a single descendant and a
  whole nation.
- Genesis 3:15 contains the first biblical prophecy, promising the 'Seed of the woman'
  would crush the serpent.
- In the Parable of the Sower, the seed specifically represents the Word of God planted
  in human hearts.
