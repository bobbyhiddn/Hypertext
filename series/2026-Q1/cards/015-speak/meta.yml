number: '015'
word: SPEAK
gloss: To utter words; to express thoughts, declare truth, or articulate sounds.
card_type: VERB
rarity: UNCOMMON
series: 2026-Q1
set: Babel
art_prompt: A stylized, glowing wave of golden energy rippling outward from a central
  point, shaping chaotic dust into ordered geometric forms against a dark void.
stats:
  lore: 4
  context: 5
  complexity: 2
ability: Name a card type. Target player reveals their hand. If it contains that type,
