weight_rationale: the era runs on divine address - God spake to Adam, to Noah, to
  Abram - which is thematic vocabulary with real teaching; the pillar word for utterance
  is the one the set already carries, so SPEAK stays at 3 and prints UNCOMMON
stats_rationale:
  lore: the printed verses are God speaking to Noah out of the ark and God speaking
    in time past to the fathers - in this era being addressed by God is the whole
    of revelation
  context: dabar occurs 1143 times in the Hebrew Bible; laleo occurs 296 times in
    the New Testament; total 1439
  complexity: the verb dabar and the noun dabar - a word and also a thing or matter
    - are the same consonants, and Greek splits what Hebrew joins by using laleo for
    the sounding of speech and lego for its sense
