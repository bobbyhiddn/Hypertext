ot_verse:
  ref: 1 Samuel 3:9
  snippet: Speak, LORD, for your servant hears.
nt_verse:
  ref: James 1:19
  snippet: Let every person be quick to hear, slow to speak, slow to anger.
greek:
  text: λαλέω
  translit: laleō
hebrew:
  text: דָּבַר
  translit: dābar
ot_refs: Gen 1:3 • Ex 4:10 • Ps 33:9 • Isa 55:11 • Amos 3:8
nt_refs: Matt 12:34 • Acts 4:20 • Eph 4:15 • Col 4:6 • 1 Pet 4:11
trivia:
- The Hebrew 'dabar' means both 'word' and 'thing,' implying that speech is a concrete
  reality.
- In Genesis 1, the phrase 'And God said' occurs ten times, paralleling the Ten Commandments.
- Greek uses 'laleo' for the sound of speech and 'lego' for the logical meaning or
  message.
