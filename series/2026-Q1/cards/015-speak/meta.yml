trivia:
- Genesis 1 never says God spake; it says God said - amar - and the heavier dabar
  waits until there is a man to be addressed.
- Because dabar means both word and thing, the ten commandments are literally the
  ten words, and a happening can be called a word.
- Laleo first meant to make a sound, even of animals; the New Testament raises it
  to the utterance of the gospel.
