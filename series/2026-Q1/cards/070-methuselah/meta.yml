trivia:
- Nine hundred sixty and nine years is the longest life in Scripture; Jared, his grandfather,
  is second at nine hundred sixty and two.
- Adding the years of Genesis 5, Methuselah dies in the very year the flood comes
  - the oldest man outlives none of the judgment.
- Enoch, who never died, was the father of the man who lived longest.
