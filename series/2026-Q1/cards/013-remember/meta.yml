trivia:
- Genesis 8:1 is the exact centre of the flood account; everything before it rises
  and everything after it falls.
- God remembers Noah, then Abraham, then Rachel - in each case the next word is an
  action, never a thought.
- The bow in the cloud is set there so that God may look upon it and remember; the
  sign is for the one who gave it.
