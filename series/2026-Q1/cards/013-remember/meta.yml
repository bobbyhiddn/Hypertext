weight: 3
weight_rationale: God remembering Noah is the hinge the flood turns on and remembering
  the covenant is how the era's promises hold - thematic vocabulary with real teaching,
  while the pillar itself is COVENANT, so REMEMBER stays at 3
stats_rationale:
  lore: the printed verses turn the flood by God remembering Noah and answer a dying
    thief who asks to be remembered - in this era remembering is the act that saves
  context: zakar occurs 235 times in the Hebrew Bible; mnaomai occurs 21 times in
    the New Testament; total 256
  complexity: 'zakar never means mere recollection: God remembering is God acting,
    and the noun zikkaron is a memorial object, so translators must decide between
    mind and deed'
