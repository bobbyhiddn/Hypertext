trivia:
- 'Proverbs pictures a quarrel as a seep in an earth bank: stop it while it is a thread
  of water, because a breach cannot be argued shut.'
- Proverbs 26:20 gives the other end of the same rule - where there is no talebearer,
  the strife ceaseth.
- Eris was also the name Greeks gave the goddess of strife; Paul lists it among the
  works of the flesh.
