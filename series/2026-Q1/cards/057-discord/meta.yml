stats_rationale:
  lore: in this card's verses strife is a thing to be left off before it breaks out
    and a mark of the carnal - a recognized theme with clear teaching, not a doctrine
  context: madon occurs 19 times in the Hebrew Bible; eris occurs 9 times in the New
    Testament; total 28
  complexity: Hebrew keeps four words for strife - madon, midyan, rib and massah -
    and the printed verse of Proverbs 6:19 uses the second where 17:14 uses the first;
    eris then has to stand for all of them in Greek, which is why lists of the works
    of the flesh vary in English
ability: Choose another player; each of you reveals one card from your hand. If your
  revealed card has the higher COMPLEXITY, add two cards from Sheol to your hand.
ot_verse:
  ref: Proverbs 17:14
  snippet: 'The beginning of strife is as when one letteth out water: therefore leave
    off contention, before it be meddled with'
nt_verse:
  ref: 1 Corinthians 3:3
  snippet: for whereas there is among you envying, and strife, and divisions, are
    ye not carnal
