trivia:
- The Hebrew 'shabat' primarily means 'to cease' or 'desist,' rather than just recovering
  from fatigue.
- God's rest on the seventh day was not due to exhaustion, but marked the completion
  of creation.
- Hebrews 4 links the creation Sabbath to the eternal spiritual rest found in salvation.
