number: '026'
word: REST
gloss: To cease from work or movement; to be at peace.
card_type: VERB
rarity: GLORIOUS
series: 2026-Q1
set: Babel
art_prompt: A tranquil, sunlit meadow with a single large stone in the center, overgrown
  with soft moss and wildflowers, symbolizing ancient stillness. A discarded sword
  lies rusting in the tall grass nearby. Warm golden lighting, ethereal atmosphere,
  oil painting style.
stats:
  lore: 5
  context: 5
  complexity: 2
ability: Target player cannot Play or Record during their next turn.
ot_verse:
  ref: Genesis 2:2
  snippet: And on the seventh day God ended his work which he had made; and he rested
    on the seventh day.
nt_verse:
  ref: Matthew 11:28
  snippet: Come unto me, all ye that labour and are heavy laden, and I will give you
    rest.
greek:
  text: ἀναπαύω
  translit: anapauō
hebrew:
  text: שָׁבַת
  translit: shabat
ot_refs: Gen 2:2 • Ex 20:8 • Ps 23:2 • Isa 14:7
nt_refs: Matt 11:28 • Heb 4:9 • Mark 6:31 • Rev 14:13
trivia:
- The Hebrew 'shabat' means 'to cease' or 'stop,' emphasizing that creation was complete,
  not that God was tired.
- In music, a 'rest' is a specific interval of silence, essential for the rhythm and
  meaning of the composition.
- Hebrews 4 describes a 'Sabbath rest' that remains for God's people, linking the
  weekly Sabbath to eternal salvation.
