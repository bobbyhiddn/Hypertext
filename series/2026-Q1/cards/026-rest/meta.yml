number: '026'
word: REST
gloss: To cease work or movement in order to relax, refresh oneself, or recover strength.
card_type: VERB
rarity: GLORIOUS
series: 2026-Q1
set: Babel
art_prompt: A peaceful, glowing garden at twilight with a discarded tool lying in
  the grass, symbolizing the end of work.
stats:
  lore: 5
  context: 4
  complexity: 2
ability: Draw 3 cards. Until your next turn, no player may Record.
ot_verse:
  ref: Genesis 2:2
  snippet: And on the seventh day God ended his work which he had made; and he rested...
nt_verse:
  ref: Matthew 11:28
  snippet: Come unto me, all ye that labour and are heavy laden, and I will give you
    rest.
greek:
  text: ἀνάπαυσις
  translit: anapausis
hebrew:
  text: שָׁבַת
  translit: shabat
ot_refs: Gen 2:2 • Ex 20:8 • Ps 23:2
nt_refs: Matt 11:28 • Heb 4:9 • Rev 14:13
trivia:
- The Hebrew 'shabat' primarily means 'to cease' or 'stop working,' not just to relax.
- In music, a 'rest' is an interval of silence that is essential for the rhythm of
  the composition.
- Hebrews 4 uses the unique word 'sabbatismos' to describe the eternal rest remaining
  for God's people.
