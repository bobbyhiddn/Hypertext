number: '026'
word: REST
gloss: To cease work or movement in order to relax, refresh, or recover strength.
card_type: VERB
rarity: GLORIOUS
series: 2026-Q1
set: Babel
art_prompt: A weathered iron plow abandoned in a grassy field at twilight, golden
  hour lighting, peaceful and still, oil painting style, no text
stats:
  lore: 5
  context: 5
  complexity: 2
ability: Target player skips their next turn.
ot_verse:
  ref: Genesis 2:2
  snippet: And on the seventh day God ended his work which he had made; and he rested.
nt_verse:
  ref: Matthew 11:28
  snippet: Come unto me, all ye that labour and are heavy laden, and I will give you
    rest.
greek:
  text: ἀναπαύω
  translit: Anapauō
hebrew:
  text: שָׁבַת
  translit: Shabat
ot_refs: Gen 2:2 • Ex 20:8 • Lev 25:4 • Ps 23:2
nt_refs: Matt 11:28 • Heb 4:9 • Rev 14:13 • Mark 2:27
trivia:
- The Hebrew *shabat* literally means 'to cease' or 'stop,' not just to relax.
- God's rest on the seventh day was not from exhaustion, but completion.
- Jesus offers 'rest for the soul,' fulfilling the Sabbath's ultimate promise.
