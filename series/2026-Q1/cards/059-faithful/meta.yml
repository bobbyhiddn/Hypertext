trivia:
- Neeman is the passive of aman - to be made firm - the same root as amen and emunah, faith.
- Pistos means faithful and also believing; the faithful God and the faithful servant share
  one Greek word.
- After Babel's broken promise of a name, God made a covenant and kept it - faithfulness is
  the reply to the tower.
