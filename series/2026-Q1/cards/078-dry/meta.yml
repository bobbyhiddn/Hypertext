trivia:
- The dry appears on the third day before anything is planted in it; the ground is
  made ready before it is filled.
- Genesis 8 measures the flood's end twice - the waters were abated, and then the
  face of the ground was dry.
- Jesus asks what shall be done in the dry, using the same word Greek readers knew
  for dry land.
