trivia:
- The ground is cursed for the man's sake, not the man - the sentence falls on his
  work, and thorns are the first sign of it.
- 'Genesis 12:3 uses two verbs: him that maketh light of thee I will bind under a
  curse.'
- Both Jesus and Paul answer the verb with its opposite - bless them that curse you,
  bless and curse not.
