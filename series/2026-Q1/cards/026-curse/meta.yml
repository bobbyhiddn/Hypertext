weight_rationale: the era's judgments are all spoken as this verb - the ground for
  Adam's sake, Canaan after the tent, and the sentence on whoever curses Abram; a
  named judgment the era turns on, though the pillar words are the covenants themselves
stats_rationale:
  lore: the printed verses make the curse both God's sentence on the ground and the
    thing a tongue must not do to a man made in God's image - a major theme close
    to doctrine
  context: arar occurs 63 times in the Hebrew Bible; kataraomai occurs 5 times in
    the New Testament; total 68
  complexity: Hebrew has two verbs where English has one - arar is the binding sentence,
    qalal is to make light of - and Genesis 12:3 uses both in a single line, so the
    English reads curse twice for two different acts
