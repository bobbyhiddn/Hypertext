number: '017'
word: GROUND
gloss: The solid surface of the earth; soil; a foundation or basis for belief.
card_type: NOUN
rarity: UNCOMMON
series: 2026-Q1
set: Babel
art_prompt: A cross-section of rich, dark earth layers revealing glowing roots and
  an ancient, buried foundation stone; abstract style, no text.
