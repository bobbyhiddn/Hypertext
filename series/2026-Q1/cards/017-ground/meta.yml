ot_verse:
  ref: Genesis 2:7
  snippet: And the LORD God formed man of the dust of the ground, and breathed into
    his nostrils the breath of life.
nt_verse:
  ref: 1 Timothy 3:15
  snippet: The church of the living God, the pillar and ground of the truth.
