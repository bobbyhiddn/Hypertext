weight: 5
weight_rationale: 'a pillar of the set: the bow in the cloud after the flood and the
  promise to Abram are the two hinges the era turns on, and every later covenant is
  read back through them'
stats_rationale:
  lore: the printed verses put the whole structure of promise on the word - the token
    in the cloud and the cup of the new testament; a doctrine hangs on it
  context: berit occurs 284 times in the Hebrew Bible; diatheke occurs 33 times in
    the New Testament; total 317
  complexity: Hebrew does not make a covenant, it cuts one - karat berit, from the
    halves of animals in Genesis 15 - while the Greek diatheke is ordinarily a last
    will, which is why English alternates covenant and testament in the same book
