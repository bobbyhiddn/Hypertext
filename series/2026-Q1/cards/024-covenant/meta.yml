number: '024'
word: COVENANT
gloss: A solemn, binding agreement or promise, often sealed by blood or oath.
card_type: NOUN
rarity: GLORIOUS
series: 2026-Q1
set: Babel
art_prompt: A beam of brilliant light striking a stone altar and splitting it, with
  a spectrum of colors emerging from the fissure; abstract, ethereal style, no text.
stats:
  lore: 5
  context: 5
  complexity: 4
ability: Shuffle your hand and Sheol into the Tower, then draw 7 cards.
ot_verse:
  ref: Jeremiah 31:31
  snippet: Behold, the days are coming... when I will make a new covenant with the
    house of Israel.
nt_verse:
  ref: Luke 22:20
  snippet: This cup is the new covenant in my blood, which is poured out for you.
greek:
  text: διαθήκη
  translit: diathēkē
hebrew:
  text: בְּרִית
  translit: berit
ot_refs: Gen 9 • Gen 15 • Ex 24 • Jer 31
nt_refs: Matt 26 • Luke 22 • Heb 8 • Heb 9
trivia:
- The Hebrew idiom 'karat berit' literally means 'to cut a covenant,' referring to
  the dividing of sacrificial animals.
- Major biblical covenants include the Noahic, Abrahamic, Mosaic, Davidic, and the
  New Covenant.
- Greek uses 'diathēkē' (testament/will) rather than 'synthēkē' (contract) to emphasize
  God's initiative.
