trivia:
- The first covenant named in Scripture is with Noah, and the second is made with
  every living creature, not with people alone.
- Hebrew cuts a covenant; Genesis 15 shows why, with the halves laid out and a flame
  passing between them.
- Diatheke is the ordinary Greek word for a will, which is why Hebrews 9 can argue
  from the death of the one who made it.
