number: '024'
word: COVENANT
gloss: A binding agreement, compact, or treaty; in Scripture, a relationship established
  by God with His people, often sealed by oath or blood.
card_type: NOUN
rarity: GLORIOUS
series: 2026-Q1
set: Babel
art_prompt: A surreal, glowing scene of a smoking fire pot and a flaming torch floating
  between divided halves of a sacrifice under a vast, starry night sky.
stats:
  lore: 5
  context: 5
  complexity: 4
ability: Name a card type. Target player reveals their hand; take all cards of that
  type from their hand into yours.
ot_verse:
  ref: Jeremiah 31:31
  snippet: Behold, the days are coming... when I will make a new covenant with the
    house of Israel.
nt_verse:
  ref: Luke 22:20
  snippet: This cup that is poured out for you is the new covenant in my blood.
greek:
  text: διαθήκη
  translit: diathēkē
hebrew:
  text: בְּרִית
  translit: berit
ot_refs: Gen 9:13 • Gen 15:18 • Ex 24:8 • Jer 31:31
nt_refs: Luke 22:20 • Heb 8:6 • Gal 3:17 • Heb 9:16
trivia:
- Hebrew 'berit' implies 'cutting,' referring to the ancient ritual of walking between
  severed animals.
- Greek 'diatheke' means 'testament,' emphasizing God's unilateral promise rather
  than a negotiated contract.
- 'The Bible is structured around five major covenants: Noahic, Abrahamic, Mosaic,
  Davidic, and the New Covenant.'
