number: '024'
word: COVENANT
gloss: A solemn, binding agreement; a divine pledge of relationship and faithfulness.
card_type: NOUN
rarity: GLORIOUS
series: 2026-Q1
set: Babel
art_prompt: Two weathered hands clasping firmly over a rough stone altar, surrounded
  by a glowing, ethereal ribbon of light that weaves between them, set against a backdrop
  of a parted storm cloud revealing a starry sky.
stats:
  lore: 5
  context: 5
  complexity: 3
ability: Shuffle Sheol into the Tower, then draw cards until you have 7 in hand.
ot_verse:
  ref: Jeremiah 31:31
  snippet: Behold, the days are coming... when I will make a new covenant with the
    house of Israel.
nt_verse:
  ref: Luke 22:20
  snippet: This cup is the new covenant in my blood, which is poured out for you.
greek:
  text: διαθήκη
  translit: diathēkē
hebrew:
  text: בְּרִית
  translit: berit
ot_refs: Gen 9 • Gen 15 • Ex 24 • 2 Sam 7 • Jer 31
nt_refs: Matt 26 • Luke 22 • Gal 3 • Heb 8 • Heb 9
trivia:
- The Hebrew 'berit' implies 'cutting,' referencing the ancient ritual of walking
  between halved animals.
- Greek 'diathēkē' was chosen over 'synthēkē' to imply a divine ordinance rather than
  a mutual contract.
- 'The Bible outlines five major covenants: Noahic, Abrahamic, Mosaic, Davidic, and
  the New Covenant.'
