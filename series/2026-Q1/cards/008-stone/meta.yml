trivia:
- There is no building stone in the alluvial plain of Shinar, so Babel's builders
  burned brick for it and used slime for morter - a city of substitutes from the first
  course up.
- 'Greek splits the one Hebrew word: lithos is a stone a man can lift and petra is
  the rock a house is founded on, and both stand for eben.'
- Matthew 16:18 sets a name against a noun, Petros against petra - masculine for the
  man, feminine for the rock - a pun that works only in Greek.
