stats_rationale:
  lore: the printed verses set the builders' want of stone on the plain beside the
    rock a church is founded on - a recognized theme with clear teaching, though the
    doctrine rests on the builder rather than on the material
  context: eben occurs 272 times in the Hebrew Bible; petra occurs 15 times in the
    New Testament; total 287
  complexity: Genesis 11:3 turns on a near-pun, lebenah put in the place of eben -
    brick for stone - and Greek divides what Hebrew keeps whole, lithos for a stone
    a man can lift and petra for living rock, so one eben is translated two ways by
    size and setting
