    the prayer of John 17 restores; a recognized theme with clear teaching on this
    card's own verses
  context: echad occurs 970 times in the Hebrew Bible; heis occurs 345 times in the
    New Testament; total 1315, but a numeral maxes the count for free, so CONTEXT
    caps at 3
  complexity: echad can mean a compound unity - one flesh, the people is one - which
    is why the Shema is argued over; a derivation worth explaining
