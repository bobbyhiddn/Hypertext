trivia:
- Abram feared Sarai's beauty in Egypt; the fear, not the beauty, produced the lie
  that she was his sister.
- Ecclesiastes says God has made every thing beautiful in his time - yapheh joined
  to the idea of season, exactly as horaios is in Greek.
- The lame man of Acts 3 sat at the temple gate called Beautiful, horaia, and was
  healed there.
