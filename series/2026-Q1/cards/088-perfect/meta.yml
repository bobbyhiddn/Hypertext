ot_verse:
  ref: Genesis 6:9
  snippet: Noah was a just man and perfect in his generations
nt_verse:
  ref: Matthew 5:48
  snippet: Be ye therefore perfect, even as your Father which is in heaven is perfect
greek:
  text: τέλειος
  translit: teleios
hebrew:
  text: תָּמִים
  translit: tamim
ot_refs: Gen 6:9 • Gen 17:1 • Deut 18:13
nt_refs: Matt 5:48 • Col 1:28 • James 1:4
trivia:
- Tamim is the word for a sacrifice without blemish; applied to Noah it says whole,
  not sinless.
- God tells Abram to walk before me, and be thou tamim - the same standard, given
  as a command instead of a verdict.
- Teleios is built on telos, an end or goal; the perfect thing is the finished thing,
  not the flawless one.
