stats_rationale:
  lore: perfect in his generations is why Noah is saved, and Be ye therefore perfect
    is the sermon's summary - a doctrine hangs on the word
  context: tamim occurs 91 times in the Hebrew Bible; teleios occurs 19 times in the
    New Testament; total 110
  complexity: tamim means whole or unblemished rather than flawless, and is the sacrifice
    word before it is a character word; teleios means brought to its end or complete,
    so both languages say finished where English says perfect - a translation choice
    that changes the doctrine
weight: 4
weight_rationale: the verdict on Noah that spares the world and the standard given
  to Abram - a named judgment the era turns on, and the word people look for
ability: Look at the top four cards of the Tower and add up to two of those cards
  that each have LORE four or more to your hand. If the cards in your Pages have total
