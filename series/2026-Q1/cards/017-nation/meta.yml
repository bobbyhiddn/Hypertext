weight: 3
weight_rationale: the table of nations and the promise of a great nation are what
  the era ends in - thematic vocabulary with real teaching; the named event is Babel
  itself rather than the word nation, so it stays at 3
stats_rationale:
  lore: the printed verses promise Abram a great nation and call a scattered people
    a holy nation - a recognized theme of the era with clear teaching, though no doctrine
    rests on the word itself
  context: goy occurs 560 times in the Hebrew Bible; ethnos occurs 162 times in the
    New Testament; total 722
  complexity: goy and am divide between them what English calls nation and people,
    and the Septuagint's ethnos becomes Gentiles in English whenever the nation in
    view is not Israel - one word translated two ways by context
