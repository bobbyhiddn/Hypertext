trivia:
- Genesis 10 counts seventy nations from the three sons of Noah, and Genesis 11 explains
  how they came to be separate.
- Israel is called a goy in Genesis 12:2 - the word is not reserved for outsiders
  until much later.
- 1 Peter 2:9 hands Israel's titles to a scattered church, holy nation among them,
  and the Greek word is the one usually rendered Gentiles.
