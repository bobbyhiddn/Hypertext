weight: 3
weight_rationale: calling upon the name of the LORD and making us a name at Babel
  are two of the turns the era is built on, and the noun stands behind the patriarch
  Shem - thematic vocabulary with real teaching, while the promise the era hangs on
  is carried by COVENANT, so NAME stays at 3
stats_rationale:
  lore: the printed verses give the naming of every living creature and the name given
    above every name - a recognized theme of the era with clear teaching, though in
    Genesis what is taught hangs on who does the calling rather than on the noun
  context: shem occurs 864 times in the Hebrew Bible; onoma occurs 231 times in the
    New Testament; total 1095
  complexity: shem is a standing rather than a label - to make a name is to seize
    a reputation, to call on the name is to worship, and to cut off a name is to end
    a house - and it is a proper name besides, so Babel's builders grasp at shem two
    chapters after Shem has been given one
