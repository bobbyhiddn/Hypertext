  complexity: 2
ability: Draw 1. If you have a NAME in your Pages, draw 1 more.
ot_verse:
  ref: Proverbs 22:1
  snippet: A good name is rather to be chosen than great riches, and loving favour rather
    than silver and gold.
nt_verse:
  ref: Philippians 2:9
  snippet: Wherefore God also hath highly exalted him, and given him a name which is above
    every name.
