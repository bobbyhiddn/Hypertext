trivia:
- 'Genesis 2:19 is the first recorded speech of a man: God brings the creatures to
  Adam to see what he would call them, and whatever he calls them stands.'
- Babel's builders say let us make us a name, two chapters after a son of Noah has
  been given the name that simply means Name.
- To act in a name, in both Testaments, is to act in the authority the name carries
  - which is why calling on the name of the LORD, begun in the days of Enos, counts
  as worship.
