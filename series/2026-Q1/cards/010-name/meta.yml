number: '010'
word: NAME
gloss: A word or phrase by which a person, place, or concept is known, designated,
  or addressed; distinct from essence yet representing it.
card_type: NOUN
rarity: COMMON
series: 2026-Q1
set: Babel
art_prompt: A smooth, glowing white stone resting on a dark velvet cloth, illuminated
  by a single shaft of light; the stone has a unique, abstract seal carved into it,
  symbolizing identity without using letters.
stats:
  lore: 5
  context: 5
  complexity: 2
ability: Draw 1. If you have a NAME in your Pages, draw 1 more.
ot_verse:
  ref: Proverbs 22:1
  snippet: A good name is rather to be chosen than great riches, and loving favour
    rather than silver and gold.
nt_verse:
  ref: Philippians 2:9
  snippet: Wherefore God also hath highly exalted him, and given him a name which
    is above every name.
greek:
  text: ὄνομα
  translit: onoma
hebrew:
  text: שֵׁם
  translit: shem
ot_refs: Gen 2:19 • Ex 3:15 • Ps 20:7 • Isa 56:5
nt_refs: Matt 28:19 • Acts 4:12 • Eph 1:21 • Rev 2:17
trivia:
- In biblical culture, a name was not just a label but represented the person's character,
  authority, and essential nature.
- God's personal name, YHWH, was considered so holy that readers would substitute
  'Adonai' (Lord) to avoid speaking it.
- Receiving a new name (e.g., Jacob to Israel) often signified a divine transformation
  of destiny and identity.
