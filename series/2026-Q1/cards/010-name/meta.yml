trivia:
- In biblical culture, a name was not just a label but represented the person's character,
  authority, and essential nature.
- God's personal name, YHWH, was considered so holy that readers would substitute
  'Adonai' (Lord) to avoid speaking it.
- Receiving a new name (e.g., Jacob to Israel) often signified a divine transformation
  of destiny and identity.
