number: '010'
word: NAME
gloss: A word or phrase by which a person, place, or concept is known, designated, or addressed;
  distinct from essence yet representing it.
card_type: NOUN
rarity: COMMON
series: 2026-Q1
set: Babel
art_prompt: A smooth, glowing white stone resting on a dark velvet cloth, illuminated by a
  single shaft of light; the stone has a unique, abstract seal carved into it, symbolizing
  identity without using letters.
