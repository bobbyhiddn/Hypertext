rarity: COMMON
series: 2026-Q1
set: Babel
art_prompt: A smooth, glowing white stone resting on a dark velvet cloth, illuminated
  by a single shaft of light; the stone has a unique, abstract seal carved into it,
  symbolizing identity without using letters.
